function icon(name,cls=''){return '<svg class="ui-icon '+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||'')+'</svg>'}

const today=()=>new Date().toISOString().slice(0,10); const now=()=>new Date().toISOString();
function seed(){return {version:DATA_VERSION,settings:{initialStock:0,defaultPriceCents:1500,publisherMode:'total',publisherValue:100},events:[],records:[],cashMovements:[],publisherPayments:[]};}
let state=seed(),view='home',eventFilter='all',currentEventId=null,eventTab='summary',recordFilter='all',recordEvent='all',query='';
let saveQueue=Promise.resolve(),syncState='loading',stateRevision=0,savedRevision=0;
let stationKind='sale',stationDrafts={},stationNotice='',stationSubmitAt=0;
function apiHeaders(extra={}){return {apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra}}
function validConfig(){return /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL)&&SUPABASE_KEY.startsWith('sb_publishable_')}
function syncNoticeMarkup(){return 'Há alterações por guardar online. Mantém esta página aberta e tenta novamente quando tiveres ligação.<button class="btn outline" type="button" onclick="retrySave()">Tentar guardar novamente</button>'}
function setSync(v){syncState=v;const el=document.getElementById('syncState');if(el){el.textContent=v==='saving'?'A guardar…':v==='saved'?'Guardado ✓':v==='error'?'Por guardar':'A ligar…';el.className='sync '+v}const notice=document.getElementById('syncNotice');if(notice)notice.hidden=v!=='error'}
async function saveRemote(snapshot,revision){
  if(!validConfig())throw new Error('Configuração da ligação inválida.');
  setSync('saving');
  const res=await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1`,{method:'PATCH',headers:apiHeaders({Prefer:'return=minimal'}),body:JSON.stringify({data:snapshot,updated_at:now()})});
  if(!res.ok)throw new Error(await res.text());
  savedRevision=Math.max(savedRevision,revision);setSync(savedRevision===stateRevision?'saved':'saving');
}
function persist(){
  const revision=++stateRevision,snapshot=JSON.parse(JSON.stringify(state));setSync('saving');render();
  saveQueue=saveQueue.then(()=>saveRemote(snapshot,revision)).catch(err=>{console.error(err);setSync('error');toast('Ainda não ficou guardado online. Não feches a página.')});return saveQueue;
}
function retrySave(){if(syncState==='saving')return;rememberStation();persist()}
async function loadRemote(){if(!validConfig()){document.getElementById('app').innerHTML=`<div class="card" style="max-width:620px;margin:60px auto"><h2>Falta ligar a base de dados</h2><div class="sub">Abre o ficheiro <b>config.js</b> no GitHub e coloca o URL e a Publishable key do Supabase.</div></div>`;return}try{setSync('loading');const res=await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1&select=data`,{headers:apiHeaders()});if(!res.ok)throw new Error(await res.text());const rows=await res.json();if(rows[0]?.data&&typeof rows[0].data==='object'){state={...seed(),...rows[0].data,version:DATA_VERSION}}else{const create=await fetch(`${SUPABASE_URL}/rest/v1/app_state`,{method:'POST',headers:apiHeaders({Prefer:'return=minimal'}),body:JSON.stringify({id:1,data:state})});if(!create.ok)throw new Error(await create.text())}setSync('saved');render()}catch(err){console.error(err);syncState='error';document.getElementById('app').innerHTML=`<div class="card" style="max-width:620px;margin:60px auto"><h2>Não foi possível ligar ao Supabase</h2><div class="sub">Confirma o conteúdo do ficheiro <b>config.js</b> e se executaste o SQL de configuração no Supabase.</div><div class="warning" style="margin-top:16px">${esc(err.message||'Erro de ligação')}</div></div>`}}
function idFor(arr){return Math.max(0,...arr.map(x=>x.id))+1}
function eventName(id){return state.events.find(e=>e.id===id)?.name||'Sem evento'}
function eventById(id){return state.events.find(e=>e.id===Number(id))}
function totals(records=state.records){const sales=records.filter(r=>r.kind==='sale');const sold=sales.reduce((a,r)=>a+r.quantity,0);const gifted=records.filter(r=>r.kind==='gift').reduce((a,r)=>a+r.quantity,0);const revenue=sales.reduce((a,r)=>a+r.quantity*r.unitPriceCents,0);const extras=sales.reduce((a,r)=>a+(r.extraCents||0),0);const paid=sales.filter(r=>r.paymentStatus==='paid');const received=paid.reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);const cash=paid.filter(r=>r.paymentMethod==='cash').reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);const mbway=paid.filter(r=>r.paymentMethod==='mbway').reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);return{sold,gifted,used:sold+gifted,revenue,extras,received,pending:revenue+extras-received,cash,mbway}}
function eventTotals(id){return totals(state.records.filter(r=>r.eventId===id))}
function ownCash(e){return e.openingCashCents+state.cashMovements.filter(m=>m.eventId===e.id).reduce((a,m)=>a+(m.kind==='float_in'?m.amountCents:-m.amountCents),0)}
function publisherDue(){const t=totals();if(state.settings.publisherMode==='fixed')return t.sold*state.settings.publisherValue;if(state.settings.publisherMode==='percentage')return Math.round(t.revenue*state.settings.publisherValue/100);return t.revenue}

function header(){return `<header class="top"><button class="brand" style="border:0;background:transparent;text-align:left;padding:0;cursor:pointer" onclick="openView('home')"><div class="logo">${icon('book','brandicon')}</div><div><div class="eyebrow">Gestão de livros</div><div class="title">O Bando da Barriga</div></div></button><div class="topactions"><span id="syncState" class="sync ${syncState}">${syncState==='saving'?'A guardar…':syncState==='saved'?'Guardado ✓':syncState==='error'?'Por guardar':'A ligar…'}</span><button class="icon" aria-label="Definições" title="Definições" onclick="openSettings()">${icon('settings')}</button></div></header><div id="syncNotice" class="sync-notice" role="alert" ${syncState==='error'?'':'hidden'}>${syncNoticeMarkup()}</div>`}

function renderHome(){const t=totals();const open=state.events.filter(e=>e.status==='open');const openRemaining=open.reduce((a,e)=>a+Math.max(0,e.booksTaken-eventTotals(e.id).used),0);const stock=state.settings.initialStock-t.used;const outside=stock-openRemaining;const sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0);const remain=Math.max(0,publisherDue()-sent);return `${open.length?`<section class="card resume-events"><h3>Continuar a registar</h3>${open.map(e=>`<button class="btn primary" onclick="openEvent(${e.id})">${icon('sale')}${esc(e.name)}${icon('chevron')}</button>`).join('')}</section>`:''}<section class="hero"><div class="herohead"><div><div class="minor">Stock disponível</div><div class="big">${stock}</div></div><div class="heroright">${outside} fora dos eventos<b>${openRemaining} em eventos ativos</b></div></div><div class="actions"><button class="btn primary" onclick="openCreateEvent()">${icon('plus')}Criar evento</button><button class="btn ghostdark" onclick="openView('events')">${icon('calendar')}${open.length} ativo${open.length===1?'':'s'}</button></div></section><section class="metrics">${metric('Vendidos',t.sold,'blue')}${metric('Total recebido',euro(t.received),'green')}${metric('Por receber',euro(t.pending),t.pending?'amber':'')}${metric('Por enviar à editora',euro(remain))}</section><section class="card"><h3>Registos rápidos sem evento</h3><div class="sub">Use apenas quando a venda ou oferta não pertence a um evento.</div><div class="actions"><button class="btn outline" onclick="openEntry('sale',null)">${icon('sale')}Venda avulsa</button><button class="btn outline" onclick="openEntry('gift',null)">${icon('gift')}Oferta avulsa</button></div></section><div class="note">O Início mostra apenas indicadores e atalhos. As listas e históricos ficam nos respetivos menus. Os dados são guardados online e ficam disponíveis quando abrires a app noutro dispositivo.</div>`}

function renderEvents(){let ev=state.events.filter(e=>eventFilter==='all'||e.status===eventFilter).sort((a,b)=>({open:0,draft:1,closed:2}[a.status]-{open:0,draft:1,closed:2}[b.status])||b.eventDate.localeCompare(a.eventDate));return `<div class="sectionhead"><div><div class="eyebrow">Gestão</div><h2>Eventos</h2></div><button class="plus" onclick="openCreateEvent()">${icon('plus')}Novo</button></div><div class="pillrow">${[['all','Todos'],['open','A decorrer'],['draft','Por abrir'],['closed','Concluídos']].map(([k,l])=>`<button class="pill ${eventFilter===k?'active':''}" onclick="setEventFilter('${k}')">${l}</button>`).join('')}</div>${ev.length?ev.map(e=>{const t=eventTotals(e.id),remaining=Math.max(0,e.booksTaken-t.used);return `<div class="event" onclick="openEvent(${e.id})"><div class="evtop"><div><span class="status ${e.status}">${statusLabel(e.status)}</span><h3>${esc(e.name)}</h3><div class="meta">${dateLabel(e.eventDate)}${e.location?' · '+esc(e.location):''}</div></div><span class="event-arrow">${icon('chevron')}</span></div><div class="evgrid"><div><small>Vendidos</small><b>${t.sold}</b></div><div><small>Por receber</small><b>${euro(t.pending)}</b></div><div><small>${e.status==='closed'?'Voltaram':'Disponíveis'}</small><b>${e.status==='draft'?'—':remaining}</b></div></div></div>`}).join(''):`<div class="card empty">Sem eventos nesta vista.</div>`}`}
function setRecordFilter(v){recordFilter=v;render()} function setRecordEvent(v){recordEvent=v;render()} function setQuery(v){query=v;renderRecordsOnly()}
function filteredRecords(eventId=null){return state.records.filter(r=>(eventId==null||r.eventId===eventId)&&(recordEvent==='all'||String(r.eventId??'none')===recordEvent)&&(recordFilter==='all'||(recordFilter==='gift'?r.kind==='gift':recordFilter==='pending'?r.paymentStatus==='pending':r.paymentMethod===recordFilter))&&(!query||[r.person,r.contact,r.note,eventName(r.eventId)].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function recordRow(r,locked=false){const amount=r.kind==='gift'?`${r.quantity} un.`:euro(r.quantity*r.unitPriceCents+(r.extraCents||0));const canEdit=!locked && (!r.eventId||eventById(r.eventId)?.status!=='closed');const place=r.eventId?eventName(r.eventId):(r.kind==='gift'?'Oferta avulsa':'Venda avulsa');const title=r.kind==='gift'?(r.person?`${esc(r.person)} · ${esc(place)}`:esc(place)):`${esc(r.person||'Venda')} · ${esc(place)}`;return `<div class="record"><div class="grow"><b>${title}</b><small>${r.quantity} livro${r.quantity===1?'':'s'} · ${r.kind==='gift'?'Oferta':methodLabel(r.paymentMethod)}${r.contact?' · '+esc(r.contact):''}${r.note?' · '+esc(r.note):''}</small></div><div class="amount ${r.paymentStatus==='pending'?'pending':''}">${amount}</div><div class="rowactions">${r.paymentStatus==='pending'?`<button title="Receber pagamento" onclick="openPayment(${r.id})">${icon('check')}<span>Receber</span></button>`:''}${canEdit?`<button title="Editar" onclick="openEntry('${r.kind}',${r.eventId===null?'null':r.eventId},${r.id})">${icon('edit')}<span>Editar</span></button><button title="Apagar" onclick="confirmDeleteRecord(${r.id})">${icon('trash')}</button>`:''}</div></div>`}

function csvCell(value){const s=String(value??'');const safe=/^[=+@\-\t\r]/.test(s)?"'"+s:s;return '"'+safe.replaceAll('"','""')+'"'}
function downloadCSV(eventId=null){
  const rows=eventId==null?[...state.records]:state.records.filter(r=>r.eventId===Number(eventId));
  rows.sort((a,b)=>a.createdAt.localeCompare(b.createdAt)||a.id-b.id);
  const data=[["Data","Evento","Tipo","Quantidade","Preço unitário","Valor dos livros","Donativos","Total","Pagamento","Estado","Nome","Contacto","Observações"]];
  for(const r of rows)data.push([r.createdAt,eventName(r.eventId),r.kind==='sale'?'Venda':'Oferta',r.quantity,(r.unitPriceCents/100).toFixed(2).replace('.',','),((r.unitPriceCents*r.quantity)/100).toFixed(2).replace('.',','),((r.extraCents||0)/100).toFixed(2).replace('.',','),((r.unitPriceCents*r.quantity+(r.extraCents||0))/100).toFixed(2).replace('.',','),methodLabel(r.paymentMethod),r.paymentStatus==='pending'?'Em falta':r.kind==='gift'?'Não aplicável':'Pago',r.person||'',r.contact||'',r.note||'']);
  const csv='\ufeff'+data.map(row=>row.map(csvCell).join(';')).join('\n');
  const scope=eventId?'evento-'+eventId+'-':'';
  downloadText('bando-da-barriga-'+scope+today()+'.csv',csv,'text/csv;charset=utf-8');toast('CSV exportado');
}

function generalSummaryText(){
  const t=totals(),open=state.events.filter(e=>e.status==='open'),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0);
  return ['O Bando da Barriga — Resumo geral',`Stock disponível: ${state.settings.initialStock-t.used}`,`Livros vendidos: ${t.sold}`,`Livros oferecidos: ${t.gifted}`,`Eventos: ${state.events.length} (${open.length} abertos)`,'',`Valor dos livros: ${euro(t.revenue)}`,`Donativos: ${euro(t.extras)}`,`Numerário recebido: ${euro(t.cash)}`,`MB WAY recebido: ${euro(t.mbway)}`,`Por receber: ${euro(t.pending)}`,`Total recebido: ${euro(t.received)}`,'',`Devido à editora: ${euro(publisherDue())}`,`Já enviado à editora: ${euro(sent)}`,`Por enviar à editora: ${euro(Math.max(0,publisherDue()-sent))}`].join('\n');
}
function eventSummaryText(id){
  const e=eventById(id);if(!e)return '';
  const t=eventTotals(e.id),back=Math.max(0,e.booksTaken-t.used),own=ownCash(e);
  const expected=e.status==='closed'&&e.closingSnapshot?e.closingSnapshot.expectedCash:own+t.cash;
  return [`O Bando da Barriga — ${e.name}`,`${dateLabel(e.eventDate)}${e.location?' · '+e.location:''}`,'',`Estado: ${statusLabel(e.status)}`,`Livros levados: ${e.booksTaken}`,`Livros vendidos: ${t.sold}`,`Livros oferecidos: ${t.gifted}`,`${e.status==='open'?'Livros a trazer':'Livros que voltaram'}: ${back}`,'',`Vendas em numerário: ${euro(t.cash)}`,`MB WAY: ${euro(t.mbway)}`,`Por receber: ${euro(t.pending)}`,`Valor dos livros: ${euro(t.revenue)}`,`Donativos: ${euro(t.extras)}`,`Dinheiro nosso na caixa: ${euro(own)}`,`Caixa esperada${e.status==='closed'?' no fecho':''}: ${euro(expected)}`,...(e.status==='closed'&&e.closingCashCents!=null?[`Caixa contada: ${euro(e.closingCashCents)}`,`Numerário confirmado no fecho: ${euro(e.closingSalesCashCents)}`,`MB WAY confirmado no fecho: ${euro(e.closingMbwayCents)}`]:[]),...(e.closingNote?['',`Observações: ${e.closingNote}`]:[])].join('\n');
}
function publisherRuleText(){
  const s=state.settings;

function publisherReportText(){
  const t=totals(),due=publisherDue(),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0);
  return ['O Bando da Barriga — Resumo para a editora',`Livros vendidos: ${t.sold}`,`Livros oferecidos: ${t.gifted}`,`Valor dos livros: ${euro(t.revenue)}`,`Donativos (separados): ${euro(t.extras)}`,`Total recebido: ${euro(t.received)}`,`Por receber: ${euro(t.pending)}`,`Regra: ${publisherRuleText()}`,'',`Valor correspondente à editora: ${euro(due)}`,`Já enviado à editora: ${euro(sent)}`,`Por enviar: ${euro(Math.max(0,due-sent))}`].join('\n');
}
async function shareText(title,text){
  try{
    if(navigator.share){await navigator.share({title,text});return}
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Resumo copiado');return}
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed');toast('Resumo copiado');
  }catch(err){if(err instanceof Error&&err.name==='AbortError')return;console.error(err);toast('Não foi possível partilhar.')}
}

function openPublisherReport(){
  const t=totals(),due=publisherDue(),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0),remain=Math.max(0,due-sent);

      <div class="sale-block"><span class="sale-label">Quantidade</span><div class="qty-stepper"><button type="button" aria-label="Diminuir quantidade" onclick="saleQty(-1)">−</button><input aria-label="Quantidade" name="quantity" type="number" inputmode="numeric" min="1" max="200" value="${r?.quantity||1}" oninput="updateSaleTotal()"><button type="button" aria-label="Aumentar quantidade" onclick="saleQty(1)">+</button></div></div>

        <button type="button" class="paychoice ${method==='cash'?'active':''}" data-method="cash" onclick="chooseSalePayment('cash')">${icon('banknote')}<span>Numerário</span></button>
        <button type="button" class="paychoice ${method==='mbway'?'active':''}" data-method="mbway" onclick="chooseSalePayment('mbway')">${icon('phone')}<span>MB WAY</span></button>
        <button type="button" class="paychoice ${method==='unpaid'?'active':''}" data-method="unpaid" onclick="chooseSalePayment('unpaid')">${icon('clock')}<span>Em falta</span></button>
      </div></div>
      ${input('person','Vendido a (opcional)',r?.person||'')}
      <div id="unpaidFields" class="unpaid-panel" ${method==='unpaid'?'':'hidden'}>
        <div class="unpaid-hint">Para um pagamento em falta, preenche o nome em “Vendido a”.</div>
        ${input('contact','Contacto (opcional)',r?.contact||'')}
      </div>
      <div class="sale-total"><span>Total desta venda</span><b id="saleTotalValue">${euro((r?.quantity||1)*defaultPrice+(r?.extraCents||0))}</b></div>
      <details class="sale-more" id="saleMore" ${showMore?'open':''}><summary>Preço, donativo e notas</summary>
        <div class="grid2">${input('price','Preço unitário (€)',(defaultPrice/100).toFixed(2).replace('.',','),'text','inputmode="decimal" oninput="updateSaleTotal()"')}${input('extra','Donativo adicional (€)',((r?.extraCents||0)/100).toFixed(2).replace('.',','),'text','inputmode="decimal" oninput="updateSaleTotal()"')}</div>
        <div class="quick-donation"><button type="button" onclick="addDonation(1)">+ 1 €</button><button type="button" onclick="addDonation(2)">+ 2 €</button><button type="button" onclick="addDonation(5)">+ 5 €</button></div>
        ${area('note','Notas (opcional)',r?.note||'')}
      </details>
    </div>`;
    showEntry(r?'Editar venda':'Registar venda','Escolhe a quantidade e a forma de pagamento. O resto só é necessário quando aplicável.',body,r?'Guardar alterações':'Guardar venda',fd=>{
      const q=Number(fd.get('quantity')),method=String(fd.get('payment')),price=parseMoney(fd.get('price')),extra=parseMoney(fd.get('extra')),person=String(fd.get('person')||'').trim();
      if(!Number.isInteger(q)||q<1)return toast('Quantidade inválida.');
      if(price<0||extra<0)return toast('Verifique os valores.');
      if(method==='unpaid'&&!person){const panel=saleForm()?.querySelector('#unpaidFields');if(panel){panel.hidden=false;panel.classList.add('error')}return toast('Indique o nome de quem ficou a dever.')}
      const existingQty=r?.quantity||0;let available;
      if(eventId){const ev=eventById(eventId);available=ev.booksTaken-eventTotals(eventId).used+existingQty}
      else{const openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0);available=state.settings.initialStock-totals().used-openAlloc+existingQty}
      if(q>available)return toast(`Só há ${Math.max(0,available)} livros disponíveis.`);
      const contact=String(fd.get('contact')||'').trim();const data={eventId:eventId??null,kind:'sale',quantity:q,unitPriceCents:price,extraCents:extra,paymentMethod:method,paymentStatus:method==='unpaid'?'pending':'paid',person,contact,note:String(fd.get('note')||'').trim()};
      if(r){Object.assign(r,data);r.paidAt=data.paymentStatus==='paid'?(r.paidAt||now()):null}
      else state.records.push({id:idFor(state.records),...data,createdAt:now(),paidAt:data.paymentStatus==='paid'?now():null});
      if(inline){delete stationDrafts[stationKey()];stationNotice=`${q} livro${q===1?'':'s'} · ${euro(q*price+extra)} · ${methodLabel(method)}. Registo adicionado.`}closeModal();toast(r?'Venda atualizada':'Venda registada');persist()
    });
    setTimeout(updateSaleTotal,25);return;
  }
  const body=input('quantity','Quantidade',r?.quantity||1,'number','min="1" max="200" inputmode="numeric"')+input('person','A quem ofereceste? (opcional)',r?.person||'')+`<details class="sale-more" ${r&&(r.contact||r.note)?'open':''}><summary>Contacto e notas</summary>${input('contact','Contacto (opcional)',r?.contact||'')}${area('note','Notas (opcional)',r?.note||'')}</details>`;
  showEntry(r?'Editar oferta':'Registar oferta','A oferta desconta do stock e não gera receita.',body,r?'Guardar alterações':'Guardar oferta',fd=>{
    const q=Number(fd.get('quantity'));if(!Number.isInteger(q)||q<1)return toast('Quantidade inválida.');
    const existingQty=r?.quantity||0;let available;
    if(eventId){const ev=eventById(eventId);available=ev.booksTaken-eventTotals(eventId).used+existingQty}
    else{const openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0);available=state.settings.initialStock-totals().used-openAlloc+existingQty}
    if(q>available)return toast(`Só há ${Math.max(0,available)} livros disponíveis.`);
    const data={eventId:eventId??null,kind:'gift',quantity:q,unitPriceCents:0,extraCents:0,paymentMethod:'none',paymentStatus:'not_applicable',person:String(fd.get('person')||'').trim(),contact:String(fd.get('contact')||'').trim(),note:String(fd.get('note')||'').trim()};
    if(r)Object.assign(r,data);else state.records.push({id:idFor(state.records),...data,createdAt:now(),paidAt:null});
    if(inline){delete stationDrafts[stationKey()];stationNotice=`Oferta de ${q} livro${q===1?'':'s'} adicionada.`}closeModal();toast(r?'Oferta atualizada':'Oferta registada');persist()
  })
}
function openPayment(id){rememberStation();const r=state.records.find(x=>x.id===id);if(!r||r.paymentStatus!=='pending')return;modal('Pagamento recebido','Como foi feito o pagamento?',select('method','Forma de pagamento',[['cash','Numerário'],['mbway','MB WAY']],'mbway'),'Guardar pagamento',fd=>{r.paymentMethod=String(fd.get('method'));r.paymentStatus='paid';r.paidAt=now();closeModal();toast('Pagamento recebido');persist()})}
function confirmDeleteRecord(id){rememberStation();const r=state.records.find(x=>x.id===id);if(r?.eventId&&eventById(r.eventId)?.status==='closed')return toast('O evento já foi fechado e validado.');confirmModal('Apagar este registo?','Esta ação não pode ser anulada.','Sim, apagar',()=>{state.records=state.records.filter(x=>x.id!==id);toast('Registo apagado');persist()})}
function openCashMovement(initialEventId=null,kind='float_in'){const openEvents=state.events.filter(e=>e.status==='open');if(!openEvents.length)return toast('Não existem eventos abertos.');const eid=initialEventId||openEvents[0].id;modal('Movimento de dinheiro próprio','Este valor é separado das vendas e não conta como receita.',select('eventId','Evento',openEvents.map(e=>[e.id,e.name]),eid)+select('kind','Movimento',[['float_in','Adicionar dinheiro para trocos'],['float_out','Retirar dinheiro próprio']],kind)+input('amount','Valor (€)','')+area('note','Observação (opcional)','','Ex.: reforço de trocos'),'Guardar movimento',fd=>{const event=eventById(Number(fd.get('eventId'))),k=String(fd.get('kind')),a=parseMoney(fd.get('amount'));if(!event||event.status!=='open'||a<=0)return toast('Verifique o evento e o valor.');if(k==='float_out'&&a>ownCash(event))return toast(`Só existem ${euro(ownCash(event))} de dinheiro próprio por retirar.`);state.cashMovements.push({id:idFor(state.cashMovements),eventId:event.id,kind:k,amountCents:a,note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();toast(k==='float_in'?'Dinheiro adicionado à caixa':'Dinheiro próprio retirado');persist()})}
function confirmDeleteCash(id){const m=state.cashMovements.find(x=>x.id===id),e=m&&eventById(m.eventId);if(!m||!e||e.status!=='open')return toast('Este movimento já não pode ser apagado.');confirmModal('Apagar este movimento?','A ação altera os totais de caixa.','Sim, apagar',()=>{const remaining=state.cashMovements.filter(x=>x.id!==id&&x.eventId===e.id).reduce((a,x)=>a+(x.kind==='float_in'?x.amountCents:-x.amountCents),e.openingCashCents);if(remaining<0)return toast('Não é possível apagar porque o saldo ficaria negativo.');state.cashMovements=state.cashMovements.filter(x=>x.id!==id);toast('Movimento apagado');persist()})}
function openPublisherPayment(){modal('Registar envio à editora','Guarde o valor, a data e a forma como o dinheiro foi enviado.',input('amount','Valor (€)','')+select('method','Forma de envio',[['bank_transfer','Transferência bancária'],['mbway','MB WAY'],['cash','Numerário'],['other','Outro']],'bank_transfer')+input('paidOn','Data',today(),'date')+select('eventId','Associar a evento (opcional)',[['','Sem associação específica'],...state.events.map(e=>[e.id,e.name])],'')+area('note','Observação (opcional)'),'Guardar envio',fd=>{const a=parseMoney(fd.get('amount'));if(a<=0)return toast('Indique o valor enviado.');state.publisherPayments.push({id:idFor(state.publisherPayments),eventId:fd.get('eventId')?Number(fd.get('eventId')):null,amountCents:a,method:String(fd.get('method')),paidOn:String(fd.get('paidOn')),note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();toast('Envio à editora registado');persist()})}
function confirmDeletePublisher(id){confirmModal('Apagar este envio?','A ação altera o total já enviado à editora.','Sim, apagar',()=>{state.publisherPayments=state.publisherPayments.filter(x=>x.id!==id);toast('Envio apagado');persist()})}
function openCloseEvent(id){const e=eventById(id),t=eventTotals(id),back=e.booksTaken-t.used,own=ownCash(e),expected=own+t.cash;const body=`<div class="review"><div><small>Livros a trazer</small><b>${back}</b></div><div><small>Dinheiro nosso</small><b>${euro(own)}</b></div><div><small>Numerário registado</small><b>${euro(t.cash)}</b></div></div><div class="closegrid">${input('books','Livros contados',back,'number','min="0"')}${input('cashSales','Numerário realizado (€)',(t.cash/100).toFixed(2).replace('.',','))}${input('mbway','MB WAY realizado (€)',(t.mbway/100).toFixed(2).replace('.',','))}${input('cashPhysical','Dinheiro físico contado na caixa (€)',(expected/100).toFixed(2).replace('.',','))}</div>${area('note','Observações do fecho','','Obrigatório se existir alguma diferença')}`;modal('Conferir o evento','Confirme livros, numerário, MB WAY e o dinheiro físico existente na caixa.',body,'Rever resumo final',fd=>{const vals={books:Number(fd.get('books')),cashSales:parseMoney(fd.get('cashSales')),mbway:parseMoney(fd.get('mbway')),cashPhysical:parseMoney(fd.get('cashPhysical')),note:String(fd.get('note')||'').trim()};if(!Number.isInteger(vals.books)||vals.books<0||['cashSales','mbway','cashPhysical'].some(k=>!String(fd.get(k)??'').trim()||vals[k]<0))return toast('Preenche as contagens e os valores do fecho.');if(vals.books!==back)return toast(`A contagem tem de coincidir com ${back} livros.`);const diff=vals.cashSales!==t.cash||vals.mbway!==t.mbway||vals.cashPhysical!==expected;if(diff&&!vals.note)return toast('Explique a diferença nas observações.');openCloseReview(e,t,back,own,expected,vals)})}
function openCloseReview(e,t,back,own,expected,v){modal('Confirmar o fecho','Valide os valores antes de concluir.',`<div class="review"><div><small>Livros contados</small><b>${v.books}</b></div><div><small>Numerário realizado</small><b>${euro(v.cashSales)}</b></div><div><small>MB WAY realizado</small><b>${euro(v.mbway)}</b></div></div><div class="review"><div><small>Caixa contada</small><b>${euro(v.cashPhysical)}</b></div><div><small>Diferença numerário</small><b>${euro(v.cashSales-t.cash)}</b></div><div><small>Diferença MB WAY</small><b>${euro(v.mbway-t.mbway)}</b></div></div>${v.note?`<div class="warning">${esc(v.note)}</div>`:''}`,'Confirmar e fechar',()=>{e.status='closed';e.closingBooks=v.books;e.closingSalesCashCents=v.cashSales;e.closingMbwayCents=v.mbway;e.closingCashCents=v.cashPhysical;e.closingNote=v.note;e.closedAt=now();e.updatedAt=now();e.closingSnapshot={...t,ownCash:own,expectedCash:expected,booksBack:back,closingSalesCashCents:v.cashSales,closingMbwayCents:v.mbway};closeModal();eventTab='summary';toast('Fecho validado e guardado');persist()})}
function openSettings(){const s=state.settings;modal('Definições gerais','Stock, preço geral e regra da editora.',input('stock','Stock inicial',s.initialStock,'number','min="0"')+input('price','Preço geral por livro (€)',(s.defaultPriceCents/100).toFixed(2).replace('.',','))+select('mode','Valor correspondente à editora',[['total','Total do valor dos livros'],['percentage','Percentagem das vendas'],['fixed','Valor fixo por livro']],s.publisherMode)+input('publisherValue',s.publisherMode==='fixed'?'Valor por livro (€)':'Percentagem / valor',s.publisherMode==='fixed'?(s.publisherValue/100).toFixed(2).replace('.',','):s.publisherValue),'Guardar',fd=>{const stock=Number(fd.get('stock')),price=parseMoney(fd.get('price')),mode=String(fd.get('mode')),raw=Number(String(fd.get('publisherValue')||'').replace(',','.'));if(!Number.isInteger(stock)||stock<totals().used||price<0||!Number.isFinite(raw)||raw<0)return toast('Verifique as definições.');state.settings.initialStock=stock;state.settings.defaultPriceCents=price;state.settings.publisherMode=mode;state.settings.publisherValue=mode==='fixed'?Math.round(raw*100):raw;closeModal();toast('Definições guardadas');persist()})}
function exportBackup(){const payload={...state,version:DATA_VERSION,exportedAt:now()};downloadText(`o-bando-da-barriga-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('Cópia de segurança exportada')}
function isValidBackup(x){return x&&typeof x==='object'&&x.settings&&Array.isArray(x.events)&&Array.isArray(x.records)&&Array.isArray(x.cashMovements)&&Array.isArray(x.publisherPayments)}
function importBackup(inputEl){const file=inputEl.files&&inputEl.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||''));if(!isValidBackup(data))throw new Error('invalid');confirmModal('Importar esta cópia?','Os dados atuais online serão substituídos pelos dados do ficheiro.','Sim, importar',()=>{state={...data,version:DATA_VERSION};closeModal();view='home';currentEventId=null;persist();toast('Dados importados')})}catch{toast('O ficheiro não é uma cópia válida.')}finally{inputEl.value=''}};reader.readAsText(file)}
function confirmClearAll(){confirmModal('Apagar todos os dados?','Eventos, vendas, ofertas, movimentos e pagamentos serão eliminados da base de dados online. Exporta uma cópia primeiro se precisares de os guardar.','Sim, apagar tudo',()=>{state=seed();closeModal();view='home';currentEventId=null;persist();toast('Dados apagados')})}
function downloadText(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)} async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado')}catch{toast('Não foi possível copiar')}}
function confirmModal(title,desc,label,onConfirm){modal(title,desc,'',label,()=>{closeModal();onConfirm()},true)}
window.addEventListener('beforeunload',e=>{if(stateRevision>savedRevision){e.preventDefault();e.returnValue=''}});
function blockPageZoom(){let lastTouchEnd=0;document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<=300&&!e.target.closest('button,a,input,select,textarea,summary'))e.preventDefault();lastTouchEnd=n},{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key))e.preventDefault()})}
blockPageZoom();
let modalTouchY=null;
const modalOverlay=document.getElementById('modal');
modalOverlay.addEventListener('touchstart',e=>{modalTouchY=e.touches.length===1?e.touches[0].clientY:null},{passive:true});
modalOverlay.addEventListener('touchmove',e=>{
  if(e.touches.length!==1||modalTouchY===null)return;
  const y=e.touches[0].clientY,delta=y-modalTouchY;modalTouchY=y;
  if(!delta)return;
  // Allow the nearest scrollable field/body to consume the current direction.
  const body=document.getElementById('modalBody');let el=e.target instanceof Element?e.target:null;
  if(el&&body.contains(el)){
    while(el){
      const overflow=getComputedStyle(el).overflowY;
      if(/auto|scroll/.test(overflow)&&el.scrollHeight>el.clientHeight+1){
        if((delta<0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)||(delta>0&&el.scrollTop>0))return;
      }
      if(el===body)break;el=el.parentElement;
    }
  }
  if(e.cancelable)e.preventDefault();
},{passive:false});
modalOverlay.addEventListener('touchend',()=>{modalTouchY=null},{passive:true});
modalOverlay.addEventListener('touchcancel',()=>{modalTouchY=null},{passive:true});
loadRemote();
</script></body></html>
