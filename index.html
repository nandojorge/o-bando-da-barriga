<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Bando da Barriga</title><style>
:root{--bg:#f6f4ef;--ink:#182033;--muted:#747985;--line:#ddd9d0;--white:#fff;--red:#e45d4e;--yellow:#f4c44e;--green:#238166;--amber:#a66c08}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1040px;margin:auto;padding:20px 16px 100px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--yellow);font-size:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:800;color:#6d7180}.title{font-size:22px;font-weight:900}.icon,.back{border:0;background:transparent;color:#555c6c;cursor:pointer;font-size:20px;border-radius:12px;padding:10px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border:1px solid var(--line);background:#fff;border-radius:16px;margin-bottom:22px}.nav button,.eventnav button{border:0;background:transparent;min-height:44px;border-radius:12px;font-weight:800;color:#6d7180;cursor:pointer}.nav button.active,.eventnav button.active{background:var(--ink);color:#fff}.screen h2{margin:4px 0 0;font-size:28px}.hero,.eventhero,.moneyhero{background:var(--ink);color:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 50px rgba(24,32,51,.12)}.herohead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.minor{font-size:14px;color:#ffffff9e}.big{font-size:52px;font-weight:950;letter-spacing:-.06em}.heroright{text-align:right;color:#ffffff9e;font-size:14px}.heroright b{display:block;color:#fff;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;min-height:46px;padding:0 16px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--red);color:#fff}.dark{background:var(--ink);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.ghostdark{background:#ffffff12;color:#fff}.danger{background:#c4382b;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.metric{background:#fff;border:1px solid #e4e0d7;border-radius:20px;padding:15px}.metric small,.review small,.evgrid small{display:block;color:#858994;font-size:12px}.metric b{display:block;margin-top:6px;font-size:20px}.metric.amber{background:#fff8e8;border-color:#f0c979}.metric.green{background:#edf8f4;border-color:#b9dfd1}.metric.blue{background:#eef5fb;border-color:#cfdfec}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:18px}.card h3{margin:0;font-size:17px}.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}.note{margin-top:14px;font-size:13px;color:var(--muted);padding:12px 14px;background:#eeeae2;border-radius:14px}.sectionhead,.movhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.plus{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{border:0;background:#fff;color:#646a77;border-radius:999px;padding:10px 14px;font-weight:750;cursor:pointer}.pill.active{background:var(--ink);color:#fff}.event{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;cursor:pointer}.event:hover{box-shadow:0 8px 24px rgba(24,32,51,.07)}.evtop{display:flex;justify-content:space-between;gap:12px}.event h3{margin:9px 0 3px}.meta{font-size:13px;color:var(--muted)}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850}.status.open{background:#e1f3ec;color:#267158}.status.draft{background:#fff1d5;color:#985f00}.status.closed{background:#e7e5e0;color:#6e7075}.evgrid,.review,.moneygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid #eeeae2}.evgrid b,.review b,.moneygrid b{display:block;margin-top:4px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:8px;margin:12px 0}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d8d4ca;background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit}.field textarea{min-height:78px;resize:vertical}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#616672}.field{margin-top:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.record,.listrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eeeae2}.record:last-child,.listrow:last-child{border-bottom:0}.grow{min-width:0;flex:1}.grow b{display:block;font-size:14px}.grow small{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowactions{display:flex;gap:4px}.rowactions button{border:0;background:#f2efe8;border-radius:9px;padding:7px 9px;cursor:pointer}.amount{font-weight:900;white-space:nowrap}.pending{color:var(--amber)}.eventpage{display:none}.eventnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border:1px solid var(--line);background:#fff;border-radius:16px;margin:18px 0}.eventtab{display:none}.eventtab.active{display:block}.sheetbg{position:fixed;inset:0;background:#18203388;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:100}.sheetbg.show{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:20px;box-shadow:0 24px 70px #0003}.sheet h2{margin:0 0 4px}.sheetactions{display:flex;gap:10px;margin-top:18px}.sheetactions .btn{flex:1}.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#182033;color:#fff;padding:11px 15px;border-radius:12px;font-weight:750;z-index:200;transition:.18s}.toast.show{transform:translate(-50%,0);opacity:1}.mobilebar{display:none}.hint{font-size:12px;color:#7b808c;margin-top:6px}.warning{padding:12px 14px;background:#fff1d5;color:#7b5711;border-radius:14px;margin-top:12px;font-size:13px}.ok{padding:12px 14px;background:#e8f5ef;color:#17664f;border-radius:14px;margin-top:12px;font-size:13px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.moneyhero .moneygrid{border-top:0;padding-top:0;margin-top:0}.smallbtn{min-height:34px;padding:0 11px;border-radius:10px}.topactions{display:flex;gap:8px;align-items:center}.sync{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#eeeae2;color:#747985;white-space:nowrap}.sync.saving,.sync.loading{background:#fff1d5;color:#8a620c}.sync.saved{background:#e1f3ec;color:#267158}.sync.error{background:#fde8e4;color:#a33b31}.closegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f1eee7;color:#686d78;font-size:11px;font-weight:800}.summarybox{white-space:pre-wrap;background:#f6f4ef;border-radius:14px;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.footerinfo{text-align:center;color:#8a8d95;font-size:11px;margin-top:24px}
@media(max-width:700px){.app{padding:14px 12px 92px}.title{font-size:18px}.nav{display:none}.mobilebar{position:fixed;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:#fffefbeF;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px #1820332d;z-index:60}.mobilebar button{border:0;background:transparent;border-radius:12px;min-height:54px;font-size:11px;font-weight:850;color:#6d7180}.mobilebar button.active{background:var(--ink);color:#fff}.metrics{grid-template-columns:1fr 1fr}.hero,.eventhero,.moneyhero{padding:20px}.big{font-size:46px}.actions{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.closegrid{grid-template-columns:1fr}.sheetbg{padding:0;align-items:flex-end}.sheet{border-radius:26px 26px 0 0}.evgrid{grid-template-columns:repeat(3,1fr);font-size:13px}.rowactions button{padding:8px}.top .eyebrow{display:none}}

@media(max-width:520px){
  .app{padding:12px 10px 88px}
  .top{align-items:center;margin-bottom:14px}
  .logo{width:40px;height:40px;border-radius:14px}
  .title{font-size:17px}
  .screen h2{font-size:24px}
  .hero,.eventhero,.moneyhero{border-radius:22px;padding:17px}

  .metrics{grid-template-columns:1fr!important}

</style></head><body><div class="toast" id="toast"></div><div class="app" id="app"></div><div class="sheetbg" id="modal"><form class="sheet" id="modalForm"><h2 id="modalTitle"></h2><div class="sub" id="modalDesc"></div><div id="modalBody"></div><div class="sheetactions" id="modalActions"></div></form></div><script src="config.js?v=2"></script><script>
const STORE='o-bando-da-barriga-data-v2';
const DATA_VERSION=2;
const SUPABASE_URL=String(window.APP_CONFIG?.SUPABASE_URL||'').replace(/\/$/,'');
const SUPABASE_KEY=String(window.APP_CONFIG?.SUPABASE_PUBLISHABLE_KEY||'');
const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format((Number(n)||0)/100);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10); const now=()=>new Date().toISOString();
function seed(){return {version:DATA_VERSION,settings:{initialStock:0,defaultPriceCents:1500,publisherMode:'total',publisherValue:100},events:[],records:[],cashMovements:[],publisherPayments:[]};}
let state=seed(),view='home',eventFilter='all',currentEventId=null,eventTab='summary',recordFilter='all',recordEvent='all',query='';
let saveQueue=Promise.resolve(),syncState='loading';
function apiHeaders(extra={}){return {apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',...extra}}
function validConfig(){return /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL)&&SUPABASE_KEY.startsWith('sb_publishable_')}
function setSync(v){syncState=v;const el=document.getElementById('syncState');if(el){el.textContent=v==='saving'?'A guardar…':v==='saved'?'Guardado ✓':v==='error'?'Erro de ligação':'A ligar…';el.className='sync '+v}}
async function saveRemote(){if(!validConfig()){setSync('error');return}setSync('saving');const res=await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1`,{method:'PATCH',headers:apiHeaders({Prefer:'return=minimal'}),body:JSON.stringify({data:state,updated_at:now()})});if(!res.ok)throw new Error(await res.text());setSync('saved')}
function persist(){render();saveQueue=saveQueue.then(saveRemote).catch(err=>{console.error(err);setSync('error');toast('Não foi possível guardar na cloud.')})}
async function loadRemote(){if(!validConfig()){document.getElementById('app').innerHTML=`<div class="card" style="max-width:620px;margin:60px auto"><h2>Falta ligar a base de dados</h2><div class="sub">Abre o ficheiro <b>config.js</b> no GitHub e coloca o URL e a Publishable key do Supabase.</div></div>`;return}try{setSync('loading');const res=await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1&select=data`,{headers:apiHeaders()});if(!res.ok)throw new Error(await res.text());const rows=await res.json();if(rows[0]?.data&&typeof rows[0].data==='object'){state={...seed(),...rows[0].data,version:DATA_VERSION}}else{const create=await fetch(`${SUPABASE_URL}/rest/v1/app_state`,{method:'POST',headers:apiHeaders({Prefer:'return=minimal'}),body:JSON.stringify({id:1,data:state})});if(!create.ok)throw new Error(await create.text())}setSync('saved');render()}catch(err){console.error(err);syncState='error';document.getElementById('app').innerHTML=`<div class="card" style="max-width:620px;margin:60px auto"><h2>Não foi possível ligar ao Supabase</h2><div class="sub">Confirma o conteúdo do ficheiro <b>config.js</b> e se executaste o SQL de configuração no Supabase.</div><div class="warning" style="margin-top:16px">${esc(err.message||'Erro de ligação')}</div></div>`}}
function idFor(arr){return Math.max(0,...arr.map(x=>x.id))+1}
function eventName(id){return state.events.find(e=>e.id===id)?.name||'Sem evento'}
function eventById(id){return state.events.find(e=>e.id===Number(id))}
function totals(records=state.records){const sales=records.filter(r=>r.kind==='sale');const sold=sales.reduce((a,r)=>a+r.quantity,0);const gifted=records.filter(r=>r.kind==='gift').reduce((a,r)=>a+r.quantity,0);const revenue=sales.reduce((a,r)=>a+r.quantity*r.unitPriceCents,0);const extras=sales.reduce((a,r)=>a+(r.extraCents||0),0);const paid=sales.filter(r=>r.paymentStatus==='paid');const received=paid.reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);const cash=paid.filter(r=>r.paymentMethod==='cash').reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);const mbway=paid.filter(r=>r.paymentMethod==='mbway').reduce((a,r)=>a+r.quantity*r.unitPriceCents+(r.extraCents||0),0);return{sold,gifted,used:sold+gifted,revenue,extras,received,pending:revenue+extras-received,cash,mbway}}
function eventTotals(id){return totals(state.records.filter(r=>r.eventId===id))}
function ownCash(e){return e.openingCashCents+state.cashMovements.filter(m=>m.eventId===e.id).reduce((a,m)=>a+(m.kind==='float_in'?m.amountCents:-m.amountCents),0)}
function publisherDue(){const t=totals();if(state.settings.publisherMode==='fixed')return t.sold*state.settings.publisherValue;if(state.settings.publisherMode==='percentage')return Math.round(t.revenue*state.settings.publisherValue/100);return t.revenue}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'})}
function methodLabel(m){return({cash:'Numerário',mbway:'MB WAY',unpaid:'Em falta',none:'—',bank_transfer:'Transferência bancária',other:'Outro'})[m]||m}
function statusLabel(s){return s==='open'?'Aberto':s==='draft'?'Por abrir':'Concluído'}
function openView(v){currentEventId=null;view=v;render();window.scrollTo(0,0)}
function openEvent(id){currentEventId=id;eventTab='summary';render();window.scrollTo(0,0)}
function closeEventPage(){currentEventId=null;view='events';render();window.scrollTo(0,0)}
function nav(){return `<nav class="nav">${[['home','⌂','Início'],['events','▣','Eventos'],['records','☷','Registos'],['money','€','Dinheiro']].map(([k,i,l])=>`<button class="${view===k?'active':''}" onclick="openView('${k}')">${i} ${l}</button>`).join('')}</nav>`}
function mobileNav(){return `<nav class="mobilebar">${[['home','⌂','Início'],['events','▣','Eventos'],['records','☷','Registos'],['money','€','Dinheiro']].map(([k,i,l])=>`<button class="${view===k?'active':''}" onclick="openView('${k}')">${i}<br>${l}</button>`).join('')}</nav>`}
function header(){return `<header class="top"><button class="brand" style="border:0;background:transparent;text-align:left;padding:0;cursor:pointer" onclick="openView('home')"><div class="logo">📖</div><div><div class="eyebrow">Gestão de livros</div><div class="title">O Bando da Barriga</div></div></button><div class="topactions"><span id="syncState" class="sync ${syncState}">${syncState==='saving'?'A guardar…':syncState==='saved'?'Guardado ✓':syncState==='error'?'Erro de ligação':'A ligar…'}</span><button class="icon" title="Definições e cópia de segurança" onclick="openSettings()">⚙︎</button></div></header>`}
function metric(label,value,tone=''){return `<div class="metric ${tone}"><small>${label}</small><b>${value}</b></div>`}
function renderHome(){const t=totals();const open=state.events.filter(e=>e.status==='open');const openRemaining=open.reduce((a,e)=>a+Math.max(0,e.booksTaken-eventTotals(e.id).used),0);const stock=state.settings.initialStock-t.used;const outside=stock-openRemaining;const sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0);const remain=Math.max(0,publisherDue()-sent);return `<section class="hero"><div class="herohead"><div><div class="minor">Stock disponível</div><div class="big">${stock}</div></div><div class="heroright">${outside} fora dos eventos<b>${openRemaining} em eventos ativos</b></div></div><div class="actions"><button class="btn primary" onclick="openCreateEvent()">＋ Criar evento</button><button class="btn ghostdark" onclick="openView('events')">▣ ${open.length} ativo${open.length===1?'':'s'}</button></div></section><section class="metrics">${metric('Vendidos',t.sold,'blue')}${metric('Total recebido',euro(t.received),'green')}${metric('Por receber',euro(t.pending),t.pending?'amber':'')}${metric('Por enviar à editora',euro(remain))}</section><section class="card"><h3>Registos rápidos sem evento</h3><div class="sub">Use apenas quando a venda ou oferta não pertence a um evento.</div><div class="actions"><button class="btn outline" onclick="openEntry('sale',null)">▣ Venda avulsa</button><button class="btn outline" onclick="openEntry('gift',null)">◇ Oferta avulsa</button></div></section><div class="note">O Início mostra apenas indicadores e atalhos. As listas e históricos ficam nos respetivos menus. Os dados são guardados online e ficam disponíveis quando abrires a app noutro dispositivo.</div>`}
function setEventFilter(v){eventFilter=v;render()}
function renderEvents(){let ev=state.events.filter(e=>eventFilter==='all'||e.status===eventFilter).sort((a,b)=>b.eventDate.localeCompare(a.eventDate));return `<div class="sectionhead"><div><div class="eyebrow">Gestão</div><h2>Eventos</h2></div><button class="plus" onclick="openCreateEvent()">＋ Novo</button></div><div class="pillrow">${[['all','Todos'],['open','A decorrer'],['draft','Por abrir'],['closed','Concluídos']].map(([k,l])=>`<button class="pill ${eventFilter===k?'active':''}" onclick="setEventFilter('${k}')">${l}</button>`).join('')}</div>${ev.length?ev.map(e=>{const t=eventTotals(e.id),remaining=Math.max(0,e.booksTaken-t.used);return `<div class="event" onclick="openEvent(${e.id})"><div class="evtop"><div><span class="status ${e.status}">${statusLabel(e.status)}</span><h3>${esc(e.name)}</h3><div class="meta">${dateLabel(e.eventDate)}${e.location?' · '+esc(e.location):''}</div></div><b>→</b></div><div class="evgrid"><div><small>Vendidos</small><b>${t.sold}</b></div><div><small>Por receber</small><b>${euro(t.pending)}</b></div><div><small>${e.status==='closed'?'Voltaram':'Disponíveis'}</small><b>${e.status==='draft'?'—':remaining}</b></div></div></div>`}).join(''):`<div class="card empty">Sem eventos nesta vista.</div>`}`}
function setRecordFilter(v){recordFilter=v;render()} function setRecordEvent(v){recordEvent=v;render()} function setQuery(v){query=v;renderRecordsOnly()}
function filteredRecords(eventId=null){return state.records.filter(r=>(eventId==null||r.eventId===eventId)&&(recordEvent==='all'||String(r.eventId??'none')===recordEvent)&&(recordFilter==='all'||(recordFilter==='gift'?r.kind==='gift':recordFilter==='pending'?r.paymentStatus==='pending':r.paymentMethod===recordFilter))&&(!query||[r.person,r.contact,r.note,eventName(r.eventId)].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function recordRow(r,locked=false){const amount=r.kind==='gift'?`${r.quantity} un.`:euro(r.quantity*r.unitPriceCents+(r.extraCents||0));const canEdit=!locked && (!r.eventId||eventById(r.eventId)?.status!=='closed');return `<div class="record"><div class="grow"><b>${r.kind==='gift'?'Oferta':esc(r.person||'Venda')}${r.eventId?' · '+esc(eventName(r.eventId)):''}</b><small>${r.quantity} livro${r.quantity===1?'':'s'} · ${r.kind==='gift'?'Oferta':methodLabel(r.paymentMethod)}${r.contact?' · '+esc(r.contact):''}${r.note?' · '+esc(r.note):''}</small></div><div class="amount ${r.paymentStatus==='pending'?'pending':''}">${amount}</div><div class="rowactions">${r.paymentStatus==='pending'?`<button title="Receber pagamento" onclick="openPayment(${r.id})">✓</button>`:''}${canEdit?`<button title="Editar" onclick="openEntry('${r.kind}',${r.eventId===null?'null':r.eventId},${r.id})">✎</button><button title="Apagar" onclick="confirmDeleteRecord(${r.id})">⌫</button>`:''}</div></div>`}
function recordsControls(){return `<div class="toolbar"><input class="search" placeholder="Pesquisar nome, contacto, nota ou evento" value="${esc(query)}" oninput="query=this.value;renderRecordsOnly()"><select class="search" onchange="setRecordEvent(this.value)"><option value="all">Todos os eventos</option><option value="none" ${recordEvent==='none'?'selected':''}>Sem evento</option>${state.events.map(e=>`<option value="${e.id}" ${recordEvent===String(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}</select><button class="btn outline smallbtn" onclick="downloadCSV()">↓ CSV</button></div><div class="pillrow">${[['all','Todos'],['cash','Dinheiro'],['mbway','MB WAY'],['pending','Em falta'],['gift','Ofertas']].map(([k,l])=>`<button class="pill ${recordFilter===k?'active':''}" onclick="setRecordFilter('${k}')">${l}</button>`).join('')}</div>`}
function renderRecords(){const rows=filteredRecords();return `<div class="sectionhead"><div><div class="eyebrow">Histórico</div><h2>Registos</h2></div><button class="plus" onclick="shareGeneral()">↗ Partilhar</button></div><div id="recordsDynamic">${recordsControls()}<div class="card">${rows.length?rows.map(r=>recordRow(r)).join(''):`<div class="empty">Nenhum registo encontrado.</div>`}</div></div>`}
function renderRecordsOnly(){if(view!=='records'||currentEventId)return render();const el=document.getElementById('recordsDynamic');if(el){const rows=filteredRecords();el.innerHTML=recordsControls()+`<div class="card">${rows.length?rows.map(r=>recordRow(r)).join(''):`<div class="empty">Nenhum registo encontrado.</div>`}</div>`}}
function renderMoney(){const t=totals(),due=publisherDue(),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0),remain=Math.max(0,due-sent),own=state.events.filter(e=>e.status==='open').reduce((a,e)=>a+ownCash(e),0);const cms=[...state.cashMovements].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),pps=[...state.publisherPayments].sort((a,b)=>b.paidOn.localeCompare(a.paidOn));return `<div class="sectionhead"><div><div class="eyebrow">Controlo financeiro</div><h2>Dinheiro</h2><div class="sub">Recebimentos, dinheiro para trocos e valores enviados à editora.</div></div></div><section class="metrics">${metric('Numerário recebido',euro(t.cash))}${metric('MB WAY recebido',euro(t.mbway))}${metric('Por receber',euro(t.pending),t.pending?'amber':'')}${metric('Dinheiro nosso em eventos',euro(own))}</section><section class="moneyhero" style="margin-top:16px"><div class="moneygrid"><div><small>Devido à editora</small><b>${euro(due)}</b></div><div><small>Já enviado</small><b>${euro(sent)}</b></div><div><small>Por enviar</small><b>${euro(remain)}</b></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="openPublisherPayment()">↗ Registar envio à editora</button><button class="btn ghostdark" style="width:100%;margin-top:9px" onclick="openPublisherReport()">▤ Resumo para a editora</button></section><section class="card"><div class="movhead"><div><h3>Dinheiro próprio para caixa</h3><div class="sub">Não conta como venda ou receita.</div></div><button class="plus" onclick="openCashMovement()" ${state.events.some(e=>e.status==='open')?'':'disabled'}>＋ Movimento</button></div>${cms.length?cms.map(m=>`<div class="listrow"><div class="grow"><b>${m.kind==='float_in'?'Dinheiro adicionado':'Dinheiro retirado'} · ${esc(eventName(m.eventId))}</b><small>${new Date(m.createdAt).toLocaleString('pt-PT')}${m.note?' · '+esc(m.note):''}</small></div><b>${m.kind==='float_in'?'+':'−'}${euro(m.amountCents)}</b>${eventById(m.eventId)?.status==='open'?`<div class="rowactions"><button onclick="confirmDeleteCash(${m.id})">⌫</button></div>`:''}</div>`).join(''):`<div class="empty">Ainda não existem movimentos adicionais de caixa.</div>`}</section><section class="card"><h3>Envios à editora</h3>${pps.length?pps.map(p=>`<div class="listrow"><div class="grow"><b>${methodLabel(p.method)}${p.eventId?' · '+esc(eventName(p.eventId)):''}</b><small>${new Date(p.paidOn+'T12:00:00').toLocaleDateString('pt-PT')}${p.note?' · '+esc(p.note):''}</small></div><b>${euro(p.amountCents)}</b><div class="rowactions"><button onclick="confirmDeletePublisher(${p.id})">⌫</button></div></div>`).join(''):`<div class="empty">Ainda não foi registado nenhum envio.</div>`}</section>`}
function renderEvent(){const e=eventById(currentEventId);if(!e){currentEventId=null;return render()}const t=eventTotals(e.id),back=Math.max(0,e.booksTaken-t.used),own=ownCash(e),expected=own+t.cash;let content='';if(e.status==='draft'){content=`<section class="eventhero"><span class="status draft">Por abrir</span><h1>${esc(e.name)}</h1><div class="meta" style="color:#ffffff99">${dateLabel(e.eventDate)}${e.location?' · '+esc(e.location):''}</div><div style="margin-top:22px;font-size:15px;color:#ffffffa0;line-height:1.6">Antes de começar, confirme quantos livros seguem para o evento e o dinheiro próprio para trocos.</div><button class="btn primary" style="width:100%;margin-top:18px" onclick="openEventOpening(${e.id})">▶ Abrir evento</button></section>`}else{content=`<section class="eventhero"><span class="status ${e.status}">${e.status==='open'?'Evento aberto':'Evento concluído'}</span><h1>${esc(e.name)}</h1><div class="meta" style="color:#ffffff99">${dateLabel(e.eventDate)}${e.location?' · '+esc(e.location):''}</div><div class="herohead" style="margin-top:20px"><div><div class="minor">${e.status==='open'?'Livros a trazer de volta':'Livros que voltaram'}</div><div class="big">${back}</div></div><div class="heroright">${e.booksTaken} levados<b>${t.sold} vendidos · ${t.gifted} oferecidos</b></div></div>${e.status==='open'?`<div class="actions"><button class="btn primary" onclick="openEntry('sale',${e.id})">▣ Registar venda</button><button class="btn ghostdark" onclick="openEntry('gift',${e.id})">◇ Oferta</button></div><button class="btn outline" style="width:100%;margin-top:10px;background:transparent;color:#fff;border-color:#ffffff33" onclick="openCloseEvent(${e.id})">✓ Rever e fechar evento</button>`:''}</section><nav class="eventnav"><button class="${eventTab==='summary'?'active':''}" onclick="setEventTab('summary')">Resumo</button><button class="${eventTab==='records'?'active':''}" onclick="setEventTab('records')">Registos</button><button class="${eventTab==='cash'?'active':''}" onclick="setEventTab('cash')">Caixa</button></nav>${renderEventTab(e,t,back,own,expected)}`}
return `<button class="back" onclick="closeEventPage()">← Voltar</button><div class="sectionhead" style="align-items:center;margin-bottom:10px"><div></div><div class="topactions"><button class="icon" onclick="openEditEvent(${e.id})" title="Editar evento">✎</button></div></div>${content}`}
function setEventTab(v){eventTab=v;render()}
function renderEventTab(e,t,back,own,expected){if(eventTab==='summary'){return `<section class="metrics" style="grid-template-columns:repeat(3,1fr)">${metric('Levados',e.booksTaken)}${metric('Vendidos',t.sold)}${metric('Oferecidos',t.gifted)}</section><section class="metrics" style="grid-template-columns:1fr 1fr">${metric('Caixa esperada',euro(e.status==='closed'&&e.closingSnapshot?e.closingSnapshot.expectedCash:expected))}${metric('Por receber',euro(t.pending),t.pending?'amber':'')}</section>${e.status==='closed'?`<section class="card" style="background:#edf8f4;border-color:#b9dfd1"><h3>✓ Fecho validado</h3><div class="review"><div><small>Numerário realizado</small><b>${euro(e.closingSalesCashCents)}</b></div><div><small>MB WAY realizado</small><b>${euro(e.closingMbwayCents)}</b></div><div><small>Caixa contada</small><b>${euro(e.closingCashCents)}</b></div></div>${e.closingNote?`<div class="ok">${esc(e.closingNote)}</div>`:''}</section>`:''}<section class="card"><h3>Resumo do evento</h3><div class="review"><div><small>Valor dos livros</small><b>${euro(t.revenue)}</b></div><div><small>Donativos</small><b>${euro(t.extras)}</b></div><div><small>${e.status==='open'?'A trazer':'Voltaram'}</small><b>${back}</b></div></div><div class="actions"><button class="btn outline" onclick="downloadCSV(${e.id})">↓ Exportar CSV</button><button class="btn dark" onclick="shareEvent(${e.id})">↗ Partilhar</button></div></section>`}
if(eventTab==='records'){const rows=state.records.filter(r=>r.eventId===e.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<section class="metrics">${metric('Numerário',euro(t.cash))}${metric('MB WAY',euro(t.mbway))}${metric('Por receber',euro(t.pending),t.pending?'amber':'')}${metric('Valor dos livros',euro(t.revenue),'green')}</section><section class="card"><h3>Movimentos</h3>${rows.length?rows.map(r=>recordRow(r,e.status!=='open')).join(''):`<div class="empty">Sem registos.</div>`}</section>`}
const moves=state.cashMovements.filter(m=>m.eventId===e.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<section class="metrics">${metric('Dinheiro nosso',euro(own))}${metric('Numerário das vendas',euro(t.cash))}${metric('MB WAY',euro(t.mbway))}${metric('Caixa física esperada',euro(e.status==='closed'&&e.closingSnapshot?e.closingSnapshot.expectedCash:expected))}</section>${e.status==='open'?`<div class="actions"><button class="btn outline" onclick="openCashMovement(${e.id},'float_in')">＋ Adicionar trocos</button><button class="btn outline" onclick="openCashMovement(${e.id},'float_out')" ${own<=0?'disabled':''}>− Retirar nosso</button></div>`:''}<section class="card"><h3>Movimentos de dinheiro próprio</h3><div class="listrow"><div class="grow"><b>Fundo inicial</b><small>Registado na abertura</small></div><b>${euro(e.openingCashCents)}</b></div>${moves.map(m=>`<div class="listrow"><div class="grow"><b>${m.kind==='float_in'?'Adicionado para trocos':'Retirado'}</b><small>${new Date(m.createdAt).toLocaleString('pt-PT')}${m.note?' · '+esc(m.note):''}</small></div><b>${m.kind==='float_in'?'+':'−'}${euro(m.amountCents)}</b>${e.status==='open'?`<div class="rowactions"><button onclick="confirmDeleteCash(${m.id})">⌫</button></div>`:''}</div>`).join('')}</section>`}
function render(){const app=document.getElementById('app');if(currentEventId){app.innerHTML=header()+renderEvent()+`<div class="footerinfo">Os dados ficam guardados apenas neste navegador. Faz cópias de segurança regularmente.</div>`;return}let body=view==='home'?renderHome():view==='events'?renderEvents():view==='records'?renderRecords():renderMoney();app.innerHTML=header()+nav()+`<main class="screen">${body}</main>`+mobileNav()+`<div class="footerinfo">Os dados ficam guardados apenas neste navegador. Faz cópias de segurança regularmente.</div>`}
function modal(title,desc,body,submitLabel='Guardar',onSubmit=null,danger=false){document.getElementById('modalTitle').textContent=title;document.getElementById('modalDesc').textContent=desc||'';document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=`<button type="button" class="btn outline" onclick="closeModal()">Cancelar</button>${onSubmit?`<button type="submit" class="btn ${danger?'danger':'primary'}">${submitLabel}</button>`:''}`;window.__modalSubmit=onSubmit;document.getElementById('modal').classList.add('show');setTimeout(()=>document.querySelector('#modal input:not([type=hidden]),#modal select,#modal textarea')?.focus(),20)}
function closeModal(){document.getElementById('modal').classList.remove('show');window.__modalSubmit=null}
document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();if(window.__modalSubmit)window.__modalSubmit(new FormData(e.currentTarget))});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function input(name,label,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function area(name,label,value='',placeholder=''){return `<div class="field"><label>${label}</label><textarea name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`}function select(name,label,options,value){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function openCreateEvent(){modal('Novo evento','Crie o evento agora. Os livros e o fundo de caixa serão confirmados quando o abrir.',input('name','Nome do evento')+`<div class="grid2">${input('eventDate','Data',today(),'date')}${input('price','Preço-base (€)',(state.settings.defaultPriceCents/100).toFixed(2).replace('.',','))}</div>`+input('location','Local (opcional)')+area('note','Observações (opcional)'),'Criar evento',fd=>{const name=String(fd.get('name')||'').trim(),d=String(fd.get('eventDate')||''),price=parseMoney(fd.get('price'));if(!name||!d||price<0)return toast('Preencha nome, data e preço.');state.events.push({id:idFor(state.events),name,eventDate:d,location:String(fd.get('location')||'').trim(),defaultPriceCents:price,status:'draft',booksTaken:0,openingCashCents:0,closingCashCents:null,closingSalesCashCents:null,closingMbwayCents:null,closingBooks:null,closingNote:'',closingSnapshot:null,note:String(fd.get('note')||'').trim(),createdAt:now(),updatedAt:now()});closeModal();view='events';toast('Evento criado');persist()})}
function openEditEvent(id){const e=eventById(id);modal('Editar evento','Atualize os dados gerais e o preço-base.',input('name','Nome',e.name)+`<div class="grid2">${input('eventDate','Data',e.eventDate,'date')}${e.status!=='draft'?input('books','Livros levados',e.booksTaken,'number',e.status==='closed'?'disabled':'min="1"'):''}</div>`+input('price','Preço-base por livro (€)',(e.defaultPriceCents/100).toFixed(2).replace('.',','))+input('location','Local',e.location)+area('note','Observações',e.note),'Guardar alterações',fd=>{const p=parseMoney(fd.get('price'));if(!String(fd.get('name')||'').trim()||p<0)return toast('Verifique os dados.');e.name=String(fd.get('name')).trim();e.eventDate=String(fd.get('eventDate'));e.defaultPriceCents=p;e.location=String(fd.get('location')||'').trim();e.note=String(fd.get('note')||'').trim();if(e.status==='open'){const n=Number(fd.get('books'));if(!Number.isInteger(n)||n<eventTotals(id).used)return toast('O número de livros não pode ser inferior aos já usados.');e.booksTaken=n}e.updatedAt=now();closeModal();toast('Evento atualizado');persist()})}
function openEventOpening(id){const e=eventById(id);modal('Abrir evento','Confirme os livros e o dinheiro próprio que fica na caixa para trocos.',input('books','Livros levados','','number','min="1"')+input('cash','Dinheiro nosso para trocos (€)','0,00'),'Confirmar e abrir',fd=>{const books=Number(fd.get('books')),cash=parseMoney(fd.get('cash'));const used=totals().used,openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0),available=state.settings.initialStock-used-openAlloc;if(!Number.isInteger(books)||books<1||books>available)return toast(`Só existem ${Math.max(0,available)} livros disponíveis.`);if(cash<0)return toast('Valor de caixa inválido.');e.booksTaken=books;e.openingCashCents=cash;e.status='open';e.updatedAt=now();closeModal();toast('Evento aberto');persist()})}
function parseMoney(v){const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?Math.round(n*100):-1}
function openEntry(kind,eventId,recordId=null){const r=recordId?state.records.find(x=>x.id===recordId):null;const e=eventId?eventById(eventId):null;if(e&&e.status!=='open'&&!r)return toast('O evento não está aberto.');const defaultPrice=r?r.unitPriceCents:(e?e.defaultPriceCents:state.settings.defaultPriceCents);let body=input('quantity','Quantidade',r?.quantity||1,'number','min="1" max="200"');if(kind==='sale')body+=`<div class="grid2">${input('price','Preço unitário (€)',(defaultPrice/100).toFixed(2).replace('.',','))}${input('extra','Donativo adicional (€)',((r?.extraCents||0)/100).toFixed(2).replace('.',','))}</div>`+select('payment','Pagamento',[['cash','Numerário'],['mbway','MB WAY'],['unpaid','Em falta']],r?.paymentMethod||'cash');body+=input('person',kind==='sale'?'Nome (obrigatório se ficar em falta)':'Pessoa/entidade (opcional)',r?.person||'')+input('contact','Contacto (opcional)',r?.contact||'')+area('note','Notas (opcional)',r?.note||'');modal(r?'Editar registo':kind==='sale'?'Registar venda':'Registar oferta',kind==='sale'?'O preço pode ser alterado nesta venda.':'A oferta desconta do stock e não gera receita.',body,r?'Guardar alterações':'Guardar',fd=>{const q=Number(fd.get('quantity'));if(!Number.isInteger(q)||q<1)return toast('Quantidade inválida.');const method=kind==='sale'?String(fd.get('payment')):'none',price=kind==='sale'?parseMoney(fd.get('price')):0,extra=kind==='sale'?parseMoney(fd.get('extra')):0,person=String(fd.get('person')||'').trim();if(kind==='sale'&&(price<0||extra<0))return toast('Verifique os valores.');if(method==='unpaid'&&!person)return toast('Indique o nome de quem ficou a dever.');const existingQty=r?.quantity||0;let available;if(eventId){const ev=eventById(eventId);available=ev.booksTaken-eventTotals(eventId).used+existingQty}else{const openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0);available=state.settings.initialStock-totals().used-openAlloc+existingQty}if(q>available)return toast(`Só há ${Math.max(0,available)} livros disponíveis.`);const data={eventId:eventId??null,kind,quantity:q,unitPriceCents:price,extraCents:extra,paymentMethod:method,paymentStatus:kind==='gift'?'not_applicable':method==='unpaid'?'pending':'paid',person,contact:String(fd.get('contact')||'').trim(),note:String(fd.get('note')||'').trim()};if(r){Object.assign(r,data);r.paidAt=data.paymentStatus==='paid'?(r.paidAt||now()):null}else state.records.push({id:idFor(state.records),...data,createdAt:now(),paidAt:data.paymentStatus==='paid'?now():null});closeModal();toast(r?'Registo atualizado':kind==='sale'?'Venda registada':'Oferta registada');persist()})}
function openPayment(id){const r=state.records.find(x=>x.id===id);if(!r||r.paymentStatus!=='pending')return;modal('Pagamento recebido','Como foi feito o pagamento?',select('method','Forma de pagamento',[['cash','Numerário'],['mbway','MB WAY']],'mbway'),'Guardar pagamento',fd=>{r.paymentMethod=String(fd.get('method'));r.paymentStatus='paid';r.paidAt=now();closeModal();toast('Pagamento recebido');persist()})}
function confirmDeleteRecord(id){const r=state.records.find(x=>x.id===id);if(r?.eventId&&eventById(r.eventId)?.status==='closed')return toast('O evento já foi fechado e validado.');confirmModal('Apagar este registo?','Esta ação não pode ser anulada.','Sim, apagar',()=>{state.records=state.records.filter(x=>x.id!==id);toast('Registo apagado');persist()})}
function openCashMovement(initialEventId=null,kind='float_in'){const openEvents=state.events.filter(e=>e.status==='open');if(!openEvents.length)return toast('Não existem eventos abertos.');const eid=initialEventId||openEvents[0].id;modal('Movimento de dinheiro próprio','Este valor é separado das vendas e não conta como receita.',select('eventId','Evento',openEvents.map(e=>[e.id,e.name]),eid)+select('kind','Movimento',[['float_in','Adicionar dinheiro para trocos'],['float_out','Retirar dinheiro próprio']],kind)+input('amount','Valor (€)','')+area('note','Observação (opcional)','','Ex.: reforço de trocos'),'Guardar movimento',fd=>{const event=eventById(Number(fd.get('eventId'))),k=String(fd.get('kind')),a=parseMoney(fd.get('amount'));if(!event||event.status!=='open'||a<=0)return toast('Verifique o evento e o valor.');if(k==='float_out'&&a>ownCash(event))return toast(`Só existem ${euro(ownCash(event))} de dinheiro próprio por retirar.`);state.cashMovements.push({id:idFor(state.cashMovements),eventId:event.id,kind:k,amountCents:a,note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();toast(k==='float_in'?'Dinheiro adicionado à caixa':'Dinheiro próprio retirado');persist()})}
function confirmDeleteCash(id){const m=state.cashMovements.find(x=>x.id===id),e=m&&eventById(m.eventId);if(!m||!e||e.status!=='open')return toast('Este movimento já não pode ser apagado.');confirmModal('Apagar este movimento?','A ação altera os totais de caixa.','Sim, apagar',()=>{const remaining=state.cashMovements.filter(x=>x.id!==id&&x.eventId===e.id).reduce((a,x)=>a+(x.kind==='float_in'?x.amountCents:-x.amountCents),e.openingCashCents);if(remaining<0)return toast('Não é possível apagar porque o saldo ficaria negativo.');state.cashMovements=state.cashMovements.filter(x=>x.id!==id);toast('Movimento apagado');persist()})}
function openPublisherPayment(){modal('Registar envio à editora','Guarde o valor, a data e a forma como o dinheiro foi enviado.',input('amount','Valor (€)','')+select('method','Forma de envio',[['bank_transfer','Transferência bancária'],['mbway','MB WAY'],['cash','Numerário'],['other','Outro']],'bank_transfer')+input('paidOn','Data',today(),'date')+select('eventId','Associar a evento (opcional)',[['','Sem associação específica'],...state.events.map(e=>[e.id,e.name])],'')+area('note','Observação (opcional)'),'Guardar envio',fd=>{const a=parseMoney(fd.get('amount'));if(a<=0)return toast('Indique o valor enviado.');state.publisherPayments.push({id:idFor(state.publisherPayments),eventId:fd.get('eventId')?Number(fd.get('eventId')):null,amountCents:a,method:String(fd.get('method')),paidOn:String(fd.get('paidOn')),note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();toast('Envio à editora registado');persist()})}
function confirmDeletePublisher(id){confirmModal('Apagar este envio?','A ação altera o total já enviado à editora.','Sim, apagar',()=>{state.publisherPayments=state.publisherPayments.filter(x=>x.id!==id);toast('Envio apagado');persist()})}
function openCloseEvent(id){const e=eventById(id),t=eventTotals(id),back=e.booksTaken-t.used,own=ownCash(e),expected=own+t.cash;const body=`<div class="review"><div><small>Livros a trazer</small><b>${back}</b></div><div><small>Dinheiro nosso</small><b>${euro(own)}</b></div><div><small>Numerário registado</small><b>${euro(t.cash)}</b></div></div><div class="closegrid">${input('books','Livros contados',back,'number','min="0"')}${input('cashSales','Numerário realizado (€)',(t.cash/100).toFixed(2).replace('.',','))}${input('mbway','MB WAY realizado (€)',(t.mbway/100).toFixed(2).replace('.',','))}${input('cashPhysical','Dinheiro físico contado na caixa (€)',(expected/100).toFixed(2).replace('.',','))}</div>${area('note','Observações do fecho','','Obrigatório se existir alguma diferença')}`;modal('Conferir o evento','Confirme livros, numerário, MB WAY e o dinheiro físico existente na caixa.',body,'Rever resumo final',fd=>{const vals={books:Number(fd.get('books')),cashSales:parseMoney(fd.get('cashSales')),mbway:parseMoney(fd.get('mbway')),cashPhysical:parseMoney(fd.get('cashPhysical')),note:String(fd.get('note')||'').trim()};if(vals.books!==back)return toast(`A contagem tem de coincidir com ${back} livros.`);const diff=vals.cashSales!==t.cash||vals.mbway!==t.mbway||vals.cashPhysical!==expected;if(diff&&!vals.note)return toast('Explique a diferença nas observações.');openCloseReview(e,t,back,own,expected,vals)})}
function openCloseReview(e,t,back,own,expected,v){modal('Confirmar o fecho','Valide os valores antes de concluir.',`<div class="review"><div><small>Livros contados</small><b>${v.books}</b></div><div><small>Numerário realizado</small><b>${euro(v.cashSales)}</b></div><div><small>MB WAY realizado</small><b>${euro(v.mbway)}</b></div></div><div class="review"><div><small>Caixa contada</small><b>${euro(v.cashPhysical)}</b></div><div><small>Diferença numerário</small><b>${euro(v.cashSales-t.cash)}</b></div><div><small>Diferença MB WAY</small><b>${euro(v.mbway-t.mbway)}</b></div></div>${v.note?`<div class="warning">${esc(v.note)}</div>`:''}`,'Confirmar e fechar',()=>{e.status='closed';e.closingBooks=v.books;e.closingSalesCashCents=v.cashSales;e.closingMbwayCents=v.mbway;e.closingCashCents=v.cashPhysical;e.closingNote=v.note;e.closedAt=now();e.updatedAt=now();e.closingSnapshot={...t,ownCash:own,expectedCash:expected,booksBack:back,closingSalesCashCents:v.cashSales,closingMbwayCents:v.mbway};closeModal();eventTab='summary';toast('Fecho validado e guardado');persist()})}
function openSettings(){const s=state.settings;const backup=`<div class="card" style="margin-top:18px;padding:14px"><h3>Dados e cópia de segurança</h3><div class="sub">Os dados ficam guardados online no Supabase. Podes também exportar uma cópia de segurança.</div><div class="actions"><button type="button" class="btn outline" onclick="exportBackup()">↓ Exportar dados</button><button type="button" class="btn outline" onclick="document.getElementById('backupFile').click()">↑ Importar dados</button></div><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"><button type="button" class="btn outline" style="width:100%;margin-top:10px" onclick="confirmClearAll()">Apagar todos os dados</button></div>`;modal('Definições gerais','Stock, preço geral, regra da editora e cópia de segurança.',input('stock','Stock inicial',s.initialStock,'number','min="0"')+input('price','Preço geral por livro (€)',(s.defaultPriceCents/100).toFixed(2).replace('.',','))+select('mode','Valor correspondente à editora',[['total','Total do valor dos livros'],['percentage','Percentagem das vendas'],['fixed','Valor fixo por livro']],s.publisherMode)+input('publisherValue',s.publisherMode==='fixed'?'Valor por livro (€)':'Percentagem / valor',s.publisherMode==='fixed'?(s.publisherValue/100).toFixed(2).replace('.',','):s.publisherValue)+backup,'Guardar',fd=>{const stock=Number(fd.get('stock')),price=parseMoney(fd.get('price')),mode=String(fd.get('mode')),raw=Number(String(fd.get('publisherValue')||'').replace(',','.'));if(!Number.isInteger(stock)||stock<totals().used||price<0||!Number.isFinite(raw)||raw<0)return toast('Verifique as definições.');state.settings.initialStock=stock;state.settings.defaultPriceCents=price;state.settings.publisherMode=mode;state.settings.publisherValue=mode==='fixed'?Math.round(raw*100):raw;closeModal();toast('Definições guardadas');persist()})}
function exportBackup(){const payload={...state,version:DATA_VERSION,exportedAt:now()};downloadText(`o-bando-da-barriga-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('Cópia de segurança exportada')}
function isValidBackup(x){return x&&typeof x==='object'&&x.settings&&Array.isArray(x.events)&&Array.isArray(x.records)&&Array.isArray(x.cashMovements)&&Array.isArray(x.publisherPayments)}
function importBackup(inputEl){const file=inputEl.files&&inputEl.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||''));if(!isValidBackup(data))throw new Error('invalid');confirmModal('Importar esta cópia?','Os dados atuais online serão substituídos pelos dados do ficheiro.','Sim, importar',()=>{state={...data,version:DATA_VERSION};closeModal();view='home';currentEventId=null;persist();toast('Dados importados')})}catch{toast('O ficheiro não é uma cópia válida.')}finally{inputEl.value=''}};reader.readAsText(file)}
function confirmClearAll(){confirmModal('Apagar todos os dados?','Eventos, vendas, ofertas, movimentos e pagamentos serão eliminados da base de dados online. Exporta uma cópia primeiro se precisares de os guardar.','Sim, apagar tudo',()=>{state=seed();closeModal();view='home';currentEventId=null;persist();toast('Dados apagados')})}
function downloadText(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)} async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado')}catch{toast('Não foi possível copiar')}}
function confirmModal(title,desc,label,onConfirm){modal(title,desc,'',label,()=>{closeModal();onConfirm()},true)}
window.addEventListener('beforeunload',()=>{});
loadRemote();
</script></body></html>
