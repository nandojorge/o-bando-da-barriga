function openEventCommission(id){const e=eventById(id);if(!e)return;rememberStation();modal('Percentagem do evento','Aplica-se a todas as vendas deste evento, incluindo as já registadas. O valor integral dos livros continua a ser enviado à editora.',percentInput(e.commissionPercent),'Guardar percentagem',fd=>{const rate=parsePercent(fd.get('commissionPercent'));if(rate===null)return toast('Indica uma percentagem entre 0 e 100, com até duas casas decimais.');setEventCommission(e,rate);closeModal();persist();toast('Percentagem atualizada')})}

function openStandaloneCommission(id){const r=state.records.find(x=>x.id===id&&x.kind==='sale'&&x.eventId==null);if(!r)return;modal('Percentagem da venda avulsa',`${r.person||'Venda sem nome'} · ${r.quantity} livro(s) · ${euro(r.quantity*r.unitPriceCents)}`,percentInput(r.commissionPercent),'Guardar percentagem',fd=>{const rate=parsePercent(fd.get('commissionPercent'));if(rate===null)return toast('Indica uma percentagem entre 0 e 100, com até duas casas decimais.');r.commissionHistory=r.commissionHistory||[];r.commissionHistory.push({fromPercent:parsePercent(r.commissionPercent),toPercent:rate,createdAt:now()});r.commissionPercent=rate;closeModal();persist();toast('Percentagem atualizada')})}
function openCommissionReceipt(){modal('Registar valor recebido da editora','Regista apenas a devolução das nossas percentagens. É separada das vendas e dos envios à editora.',input('amount','Valor recebido (€)','','text','inputmode="decimal" required')+input('receivedOn','Data do recebimento',today(),'date','required')+input('salesYear','Ano das vendas a que se refere',commissionYear==='all'?today().slice(0,4):commissionYear,'number','min="2000" max="9999" required')+area('note','Observação (opcional)'),'Guardar recebimento',fd=>{const amount=parseMoney(fd.get('amount')),receivedOn=String(fd.get('receivedOn')||''),year=Number(fd.get('salesYear'));if(amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(receivedOn)||!Number.isInteger(year)||year<2000||year>9999)return toast('Confere o valor, a data e o ano das vendas.');state.commissionReceipts=state.commissionReceipts||[];state.commissionReceipts.push({id:idFor(state.commissionReceipts),amountCents:amount,receivedOn,salesYear:year,note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();persist();toast('Recebimento da editora registado')})}
function confirmDeleteCommissionReceipt(id){confirmModal('Apagar este recebimento?','O saldo das percentagens por receber será recalculado.','Sim, apagar',()=>{state.commissionReceipts=(state.commissionReceipts||[]).filter(r=>r.id!==id);persist();toast('Recebimento apagado')})}
function renderCommissions(){
 const t=commissionTotals(commissionYear),years=[...new Set([today().slice(0,4),...state.records.filter(r=>r.kind==='sale').map(saleYear),...(state.commissionReceipts||[]).map(r=>String(r.salesYear))])].filter(x=>/^\d{4}$/.test(x)).sort().reverse(),groups=new Map();
 for(const r of t.rows){const key=r.eventId!=null?'event:'+r.eventId:'sale:'+r.id;if(!groups.has(key))groups.set(key,{record:r,quantity:0,base:0,earned:0});const g=groups.get(key);g.quantity+=r.quantity;g.base+=r.quantity*r.unitPriceCents;g.earned+=commissionAmount(r.quantity*r.unitPriceCents,saleCommissionRate(r))}
 return `<section class="card"><div class="sectionhead"><div><h3>Percentagens a receber da editora</h3><div class="sub">O valor dos livros é enviado na totalidade. A nossa percentagem é recebida mais tarde.</div></div><label class="year-filter">Vendas de<select class="search" onchange="setCommissionYear(this.value)"><option value="all">Todos os anos</option>${years.map(y=>`<option value="${y}" ${String(commissionYear)===y?'selected':''}>${y}</option>`).join('')}</select></label></div><section class="metrics money-three">${metric('Acumulado nas vendas',euro(t.earned))}${metric('Já recebido da editora',euro(t.received),'green')}${metric('Falta receber',euro(t.pending),'amber')}</section><div class="sub">Calculado sobre os livros vendidos, incluindo vendas ainda por receber. Ofertas e donativos não contam. Não altera a caixa nem os envios à editora.</div>${t.credit?`<div class="note">Recebido acima do acumulado conhecido: ${euro(t.credit)}.</div>`:''}${t.missingBooks?`<div class="warning">${t.missingBooks} livro(s) ainda sem percentagem definida. O acumulado está incompleto; preenche as percentagens abaixo.</div>`:''}<button class="btn primary full-action" onclick="openCommissionReceipt()">Registar valor recebido da editora</button></section><section class="card"><h3>Percentagens por venda ou evento</h3>${groups.size?[...groups.values()].map(g=>{const r=g.record,rate=saleCommissionRate(r);return `<div class="listrow"><div class="grow"><b>${r.eventId!=null?esc(eventName(r.eventId)):'Venda avulsa · '+esc(r.person||'Sem nome')}</b><small>${g.quantity} livro(s) · ${euro(g.base)} · ${percentText(rate)}</small></div><b>${rate===null?'Por definir':euro(g.earned)}</b><button class="btn outline smallbtn" onclick="${r.eventId!=null?'openEventCommission('+r.eventId+')':'openStandaloneCommission('+r.id+')'}">${rate===null?'Definir':'Alterar'} %</button></div>`}).join(''):'<div class="empty">Ainda não há vendas neste período.</div>'}</section><section class="card"><h3>Valores recebidos da editora</h3>${t.receipts.length?[...t.receipts].sort((a,b)=>b.receivedOn.localeCompare(a.receivedOn)||b.id-a.id).map(r=>`<div class="listrow"><div class="grow"><b>${dateLabel(r.receivedOn)}</b><small>Referente às vendas de ${r.salesYear}${r.note?' · '+esc(r.note):''}</small></div><b>${euro(r.amountCents)}</b><div class="rowactions"><button title="Apagar recebimento" aria-label="Apagar recebimento" onclick="confirmDeleteCommissionReceipt(${r.id})">${icon('trash')}</button></div></div>`).join(''):'<div class="empty">Ainda não há devoluções de percentagens registadas.</div>'}</section>`;

function setRecordFilter(v){recordFilter=v;render()} function setRecordEvent(v){recordEvent=v;render()} function setQuery(v){query=v;renderRecordsOnly()}
function filteredRecords(eventId=null){return state.records.filter(r=>(eventId==null||r.eventId===eventId)&&(recordEvent==='all'||String(r.eventId??'none')===recordEvent)&&(recordFilter==='all'||(recordFilter==='gift'?r.kind==='gift':recordFilter==='pending'?r.paymentStatus==='pending':r.paymentMethod===recordFilter))&&(!query||[r.person,r.contact,r.note,eventName(r.eventId)].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))}
function recordRow(r,locked=false){const amount=r.kind==='gift'?`${r.quantity} un.`:euro(r.quantity*r.unitPriceCents+(r.extraCents||0));const canEdit=!locked && (!r.eventId||eventById(r.eventId)?.status!=='closed');const place=r.eventId?eventName(r.eventId):(r.kind==='gift'?'Oferta avulsa':'Venda avulsa');const title=r.kind==='gift'?(r.person?`${esc(r.person)} · ${esc(place)}`:esc(place)):`${esc(r.person||'Venda')} · ${esc(place)}`;return `<div class="record"><div class="grow"><b>${title}</b><small>${r.quantity} livro${r.quantity===1?'':'s'} · ${r.kind==='gift'?'Oferta':methodLabel(r.paymentMethod)}${r.contact?' · '+esc(r.contact):''}${r.note?' · '+esc(r.note):''}</small></div><div class="amount ${r.paymentStatus==='pending'?'pending':''}">${amount}</div><div class="rowactions">${r.paymentStatus==='pending'?`<button title="Receber pagamento" onclick="openPayment(${r.id})">${icon('check')}<span>Receber</span></button>`:''}${canEdit?`<button title="Editar" onclick="openEntry('${r.kind}',${r.eventId===null?'null':r.eventId},${r.id})">${icon('edit')}<span>Editar</span></button><button title="Apagar" onclick="confirmDeleteRecord(${r.id})">${icon('trash')}</button>`:''}</div></div>`}

function csvCell(value){const s=String(value??'');const safe=/^[=+@\-\t\r]/.test(s)?"'"+s:s;return '"'+safe.replaceAll('"','""')+'"'}
function downloadCSV(eventId=null){
  const rows=eventId==null?[...state.records]:state.records.filter(r=>r.eventId===Number(eventId));
  rows.sort((a,b)=>a.createdAt.localeCompare(b.createdAt)||a.id-b.id);
  const data=[["Data","Evento","Tipo","Quantidade","Preço unitário","Valor dos livros","Donativos","Total","Pagamento","Estado","Nome","Contacto","Observações"]];
  for(const r of rows)data.push([r.createdAt,eventName(r.eventId),r.kind==='sale'?'Venda':'Oferta',r.quantity,(r.unitPriceCents/100).toFixed(2).replace('.',','),((r.unitPriceCents*r.quantity)/100).toFixed(2).replace('.',','),((r.extraCents||0)/100).toFixed(2).replace('.',','),((r.unitPriceCents*r.quantity+(r.extraCents||0))/100).toFixed(2).replace('.',','),methodLabel(r.paymentMethod),r.paymentStatus==='pending'?'Em falta':r.kind==='gift'?'Não aplicável':'Pago',r.person||'',r.contact||'',r.note||'']);
  const csv='\ufeff'+data.map(row=>row.map(csvCell).join(';')).join('\n');
  const scope=eventId?'evento-'+eventId+'-':'';
  downloadText('bando-da-barriga-'+scope+today()+'.csv',csv,'text/csv;charset=utf-8');toast('CSV exportado');
}

function generalSummaryText(){
  const t=totals(),open=state.events.filter(e=>e.status==='open'),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0);
  return ['O Bando da Barriga — Resumo geral',`Stock disponível: ${state.settings.initialStock-t.used}`,`Livros vendidos: ${t.sold}`,`Livros oferecidos: ${t.gifted}`,`Eventos: ${state.events.length} (${open.length} abertos)`,'',`Valor dos livros: ${euro(t.revenue)}`,`Donativos: ${euro(t.extras)}`,`Numerário recebido: ${euro(t.cash)}`,`MB WAY recebido: ${euro(t.mbway)}`,`Por receber: ${euro(t.pending)}`,`Total recebido: ${euro(t.received)}`,'',`Devido à editora: ${euro(publisherDue())}`,`Já enviado à editora: ${euro(sent)}`,`Por enviar à editora: ${euro(Math.max(0,publisherDue()-sent))}`].join('\n');

function eventSummaryText(id){
  const e=eventById(id);if(!e)return '';
  const t=eventTotals(e.id),back=Math.max(0,e.booksTaken-t.used),own=ownCash(e);
  const expected=e.status==='closed'&&e.closingSnapshot?e.closingSnapshot.expectedCash:eventMoney(e).cashBalance;
  return [`O Bando da Barriga — ${e.name}`,`${dateLabel(e.eventDate)}${e.location?' · '+e.location:''}`,'',`Estado: ${statusLabel(e.status)}`,`Livros levados: ${e.booksTaken}`,`Livros vendidos: ${t.sold}`,`Livros oferecidos: ${t.gifted}`,`${e.status==='open'?'Livros a trazer':'Livros que voltaram'}: ${back}`,'',`Vendas em numerário: ${euro(t.cash)}`,`MB WAY: ${euro(t.mbway)}`,`Por receber: ${euro(t.pending)}`,`Valor dos livros: ${euro(t.revenue)}`,`Donativos: ${euro(t.extras)}`,`Trocos ainda na caixa: ${euro(own)}`,`Donativos retirados da caixa: ${euro(eventMoney(e).donationsOut)}`,`Caixa esperada${e.status==='closed'?' no fecho':''}: ${euro(expected)}`,...(e.status==='closed'&&e.closingCashCents!=null?[`Caixa contada: ${euro(e.closingCashCents)}`,`Numerário confirmado no fecho: ${euro(e.closingSalesCashCents)}`,`MB WAY confirmado no fecho: ${euro(e.closingMbwayCents)}`]:[]),...(e.closingNote?['',`Observações: ${e.closingNote}`]:[])].join('\n');
}

async function shareText(title,text){
  try{
    if(navigator.share){await navigator.share({title,text});return}
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Resumo copiado');return}
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed');toast('Resumo copiado');
  }catch(err){if(err instanceof Error&&err.name==='AbortError')return;console.error(err);toast('Não foi possível partilhar.')}
}

function renderMoney(){
 const t=totals(),own=state.events.reduce((a,e)=>a+ownCash(e),0),donationsOut=state.cashMovements.filter(m=>m.kind==='donation_out').reduce((a,m)=>a+m.amountCents,0),cash=t.cash+own-donationsOut-state.publisherPayments.filter(p=>p.method==='cash').reduce((a,p)=>a+p.amountCents,0),mbway=t.mbway-state.publisherPayments.filter(p=>p.method==='mbway').reduce((a,p)=>a+p.amountCents,0),due=publisherDue(),sent=state.publisherPayments.reduce((a,p)=>a+p.amountCents,0),commissions=commissionTotals();
 const nav=`<div class="sectionhead"><div><h2>Dinheiro</h2><div class="sub">Saldos atuais, envios dos livros e percentagens a receber.</div></div></div><nav class="money-nav">${[['balances','Saldos'],['publisher','Envios'],['commission','Percentagens'],['history','Histórico']].map(([key,label])=>`<button class="${moneyTab===key?'active':''}" onclick="setMoneyTab('${key}')">${label}</button>`).join('')}</nav>`;

      <div class="sale-total"><span>Total desta venda</span><b id="saleTotalValue">${euro((r?.quantity||1)*defaultPrice+(r?.extraCents||0))}</b></div>
      <details class="sale-more" id="saleMore" ${showMore?'open':''}><summary>Preço, donativo e notas</summary>
        <div class="grid2">${input('price','Preço unitário (€)',(defaultPrice/100).toFixed(2).replace('.',','),'text','inputmode="decimal" oninput="updateSaleTotal()"')}${input('extra','Donativo adicional (€)',((r?.extraCents||0)/100).toFixed(2).replace('.',','),'text','inputmode="decimal" oninput="updateSaleTotal()"')}</div>
        <div class="quick-donation"><button type="button" onclick="addDonation(1)">+ 1 €</button><button type="button" onclick="addDonation(2)">+ 2 €</button><button type="button" onclick="addDonation(5)">+ 5 €</button></div>
        ${area('note','Notas (opcional)',r?.note||'')}
      </details>
    </div>`;
    showEntry(r?'Editar venda':'Registar venda','Escolhe a quantidade e a forma de pagamento. O resto só é necessário quando aplicável.',body,r?'Guardar alterações':'Guardar venda',fd=>{
      const q=Number(fd.get('quantity')),method=String(fd.get('payment')),price=parseMoney(fd.get('price')),extra=parseMoney(fd.get('extra')),person=String(fd.get('person')||'').trim(),commissionPercent=eventId==null?parsePercent(fd.get('commissionPercent')):parsePercent(e?.commissionPercent);
      if(eventId==null&&commissionPercent===null)return toast('Indica a percentagem desta venda (0 a 100).');
      if(!Number.isInteger(q)||q<1)return toast('Quantidade inválida.');
      if(price<0||extra<0)return toast('Verifique os valores.');
      if(method==='unpaid'&&!person){const panel=saleForm()?.querySelector('#unpaidFields');if(panel){panel.hidden=false;panel.classList.add('error')}return toast('Indique o nome de quem ficou a dever.')}
      const existingQty=r?.quantity||0;let available;
      if(eventId){const ev=eventById(eventId);available=ev.booksTaken-eventTotals(eventId).used+existingQty}
      else{const openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0);available=state.settings.initialStock-totals().used-openAlloc+existingQty}
      if(q>available)return toast(`Só há ${Math.max(0,available)} livros disponíveis.`);
      const contact=String(fd.get('contact')||'').trim();const data={eventId:eventId??null,kind:'sale',quantity:q,unitPriceCents:price,extraCents:extra,...(eventId==null?{commissionPercent}:{}),paymentMethod:method,paymentStatus:method==='unpaid'?'pending':'paid',person,contact,note:String(fd.get('note')||'').trim()};
      if(e&&!cashIsValid(e,[...state.records.filter(x=>x!==r),{...data,id:r?.id||0}]))return toast('Esta alteração deixaria retiradas sem dinheiro correspondente. Corrige primeiro os movimentos da caixa.');
      if(r){Object.assign(r,data);r.paidAt=data.paymentStatus==='paid'?(r.paidAt||now()):null}
      else state.records.push({id:idFor(state.records),...data,createdAt:now(),paidAt:data.paymentStatus==='paid'?now():null});
      if(inline){delete stationDrafts[stationKey()];stationNotice=`${q} livro${q===1?'':'s'} · ${euro(q*price+extra)} · ${methodLabel(method)}. Registo adicionado.`}closeModal();toast(r?'Venda atualizada':'Venda registada');persist()
    });
    setTimeout(updateSaleTotal,25);return;
  }
  const body=input('quantity','Quantidade',r?.quantity||1,'number','min="1" max="200" inputmode="numeric"')+input('person','A quem ofereceste? (opcional)',r?.person||'')+`<details class="sale-more" ${r&&(r.contact||r.note)?'open':''}><summary>Contacto e notas</summary>${input('contact','Contacto (opcional)',r?.contact||'')}${area('note','Notas (opcional)',r?.note||'')}</details>`;
  showEntry(r?'Editar oferta':'Registar oferta','A oferta desconta do stock e não gera receita.',body,r?'Guardar alterações':'Guardar oferta',fd=>{
    const q=Number(fd.get('quantity'));if(!Number.isInteger(q)||q<1)return toast('Quantidade inválida.');
    const existingQty=r?.quantity||0;let available;
    if(eventId){const ev=eventById(eventId);available=ev.booksTaken-eventTotals(eventId).used+existingQty}
    else{const openAlloc=state.events.filter(x=>x.status==='open').reduce((a,x)=>a+Math.max(0,x.booksTaken-eventTotals(x.id).used),0);available=state.settings.initialStock-totals().used-openAlloc+existingQty}
    if(q>available)return toast(`Só há ${Math.max(0,available)} livros disponíveis.`);
    const data={eventId:eventId??null,kind:'gift',quantity:q,unitPriceCents:0,extraCents:0,paymentMethod:'none',paymentStatus:'not_applicable',person:String(fd.get('person')||'').trim(),contact:String(fd.get('contact')||'').trim(),note:String(fd.get('note')||'').trim()};
    if(r)Object.assign(r,data);else state.records.push({id:idFor(state.records),...data,createdAt:now(),paidAt:null});
    if(inline){delete stationDrafts[stationKey()];stationNotice=`Oferta de ${q} livro${q===1?'':'s'} adicionada.`}closeModal();toast(r?'Oferta atualizada':'Oferta registada');persist()
  })
}
function openPayment(id){rememberStation();const r=state.records.find(x=>x.id===id);if(!r||r.paymentStatus!=='pending')return;modal('Pagamento recebido','Como foi feito o pagamento?',select('method','Forma de pagamento',[['cash','Numerário'],['mbway','MB WAY']],'mbway'),'Guardar pagamento',fd=>{r.paymentMethod=String(fd.get('method'));r.paymentStatus='paid';r.paidAt=now();closeModal();toast('Pagamento recebido');persist()})}
function confirmDeleteRecord(id){rememberStation();const r=state.records.find(x=>x.id===id);if(r?.eventId&&eventById(r.eventId)?.status==='closed')return toast('O evento já foi fechado e validado.');confirmModal('Apagar este registo?','Esta ação não pode ser anulada.','Sim, apagar',()=>{const remaining=state.records.filter(x=>x.id!==id);const e=r?.eventId?eventById(r.eventId):null;if(e&&!cashIsValid(e,remaining))return toast('Não é possível apagar: há retiradas ou envios associados a este dinheiro.');state.records=remaining;toast('Registo apagado');persist()})}
function openPublisherPayment(){modal('Registar envio à editora','Guarde o valor, a data e a forma como o dinheiro foi enviado.',input('amount','Valor (€)','')+select('method','Forma de envio',[['bank_transfer','Transferência bancária'],['mbway','MB WAY'],['cash','Numerário'],['other','Outro']],'bank_transfer')+input('paidOn','Data',today(),'date')+select('eventId','Associar a evento (opcional)',[['','Sem associação específica'],...state.events.map(e=>[e.id,e.name])],'')+area('note','Observação (opcional)'),'Guardar envio',fd=>{const a=parseMoney(fd.get('amount'));if(a<=0)return toast('Indique o valor enviado.');state.publisherPayments.push({id:idFor(state.publisherPayments),eventId:fd.get('eventId')?Number(fd.get('eventId')):null,amountCents:a,method:String(fd.get('method')),paidOn:String(fd.get('paidOn')),note:String(fd.get('note')||'').trim(),createdAt:now()});closeModal();toast('Envio à editora registado');persist()})}
function confirmDeletePublisher(id){confirmModal('Apagar este envio?','A ação altera o total já enviado à editora.','Sim, apagar',()=>{state.publisherPayments=state.publisherPayments.filter(x=>x.id!==id);toast('Envio apagado');persist()})}
let receiptPreview=null;
function makeEventReceiptSnapshot(e,closing=null){
  const records=state.records.filter(r=>r.eventId===e.id),movements=state.cashMovements.filter(m=>m.eventId===e.id),payments=state.publisherPayments.filter(p=>p.eventId===e.id);
  return JSON.parse(JSON.stringify({version:1,event:{id:e.id,name:e.name,eventDate:e.eventDate,location:e.location||'',note:e.note||'',booksTaken:e.booksTaken,openingCashCents:Number(e.openingCashCents||0),openingCashCorrections:e.openingCashCorrections||[],commissionPercent:parsePercent(e.commissionPercent),closedAt:e.closedAt||null,status:e.status},records,movements,payments,money:eventMoney(e),createdAt:now(),closing:closing||(e.status==='closed'?{books:e.closingBooks,cashSales:e.closingSalesCashCents,mbway:e.closingMbwayCents,cashPhysical:e.closingCashCents,note:e.closingNote||''}:null),reconstructed:e.status==='closed'&&!e.receiptSnapshot}));
}
function getEventReceiptSnapshot(id){const e=eventById(id);return e?.receiptSnapshot|| (e?makeEventReceiptSnapshot(e):null)}
function receiptLine(label,value,emphasis=false){return `<div class="receipt-line ${emphasis?'receipt-total':''}"><span>${esc(label)}</span><b>${esc(String(value))}</b></div>`}
function renderEventReceipt(snapshot,type='detail'){
 const {event:e,records,money:f,closing:v}=snapshot,publisher=type==='publisher',t=totals(records),ref=`EV-${e.id}-${publisher?'E':'D'}`,prices=new Map();
 for(const r of records.filter(r=>r.kind==='sale'))prices.set(r.unitPriceCents,(prices.get(r.unitPriceCents)||0)+r.quantity);
 let content=receiptLine('Livros vendidos',t.sold)+receiptLine('Livros oferecidos',t.gifted);
 if(publisher){content+=`<h3>Resumo dos livros</h3>`+[...prices.entries()].sort((a,b)=>a[0]-b[0]).map(([price,qty])=>receiptLine(`${qty} livro(s) × ${euro(price)}`,euro(qty*price))).join('')+(t.gifted?receiptLine(`${t.gifted} oferta(s)`,euro(0)):'')+receiptLine('Total dos livros para a editora',euro(t.revenue),true)}
 else{
  content=receiptLine('Livros levados',e.booksTaken)+content+receiptLine('Livros de volta',e.booksTaken-t.used)+`<h3>Recebimentos</h3>`+receiptLine('Valor dos livros',euro(t.revenue))+receiptLine('Donativos recebidos',euro(f.cashDonations+f.mbwayDonations))+receiptLine('Numerário recebido',euro(t.cash))+receiptLine('MB WAY recebido',euro(t.mbway))+receiptLine('Clientes: por receber',euro(t.pending))+receiptLine('Total recebido',euro(t.received),true);
  content+=`<h3>Caixa</h3>`+receiptLine('Trocos colocados (início e reforços)',euro(e.openingCashCents+f.trocosAdded))+receiptLine('Trocos retirados',euro(f.trocosRemoved))+receiptLine('Donativos retirados da caixa',euro(f.donationsOut))+receiptLine('Trocos ainda na caixa',euro(f.own))+receiptLine('Donativos ainda na caixa',euro(f.donationsInCash));
  if(f.cashSent||f.mbwaySent)content+=receiptLine('Enviado em numerário à editora',euro(f.cashSent))+receiptLine('Enviado por MB WAY à editora',euro(f.mbwaySent));
  content+=receiptLine('Caixa esperada',euro(f.cashBalance),true)+receiptLine('MB WAY disponível',euro(f.mbwayBalance))+receiptLine('Total disponível',euro(f.available),true);
  if(v){content+=`<h3>Fecho confirmado</h3>`+receiptLine('Livros contados',v.books)+receiptLine('Numerário confirmado',euro(v.cashSales))+receiptLine('MB WAY confirmado',euro(v.mbway))+receiptLine('Caixa contada',euro(v.cashPhysical));if(v.cashPhysical!==f.cashBalance)content+=receiptLine('Diferença na caixa',euro(v.cashPhysical-f.cashBalance));if(v.cashSales!==t.cash)content+=receiptLine('Diferença numerário',euro(v.cashSales-t.cash));if(v.mbway!==t.mbway)content+=receiptLine('Diferença MB WAY',euro(v.mbway-t.mbway));if(v.note)content+=`<p class="receipt-small">${esc(v.note)}</p>`}
 }
 return `<article class="event-receipt"><header><div class="receipt-brand">O Bando da Barriga</div><h2>${publisher?'Recibo para a editora':'Recibo do evento'}</h2><div>${esc(e.name)}</div><div class="receipt-small">${dateLabel(e.eventDate)}${e.location?' · '+esc(e.location):''}<br>${ref} · ${e.status==='closed'?'Evento fechado':'Pré-visualização'}</div></header>${content}<footer class="receipt-small">${e.closedAt?'Fechado em '+new Date(e.closedAt).toLocaleString('pt-PT'):'Emitido em '+new Date(snapshot.createdAt).toLocaleString('pt-PT')}${!publisher&&snapshot.reconstructed?'<br>Evento anterior: resumo dos registos disponíveis.':''}</footer></article>`;
}
function eventReceiptButtons(e){return `<section class="card"><h3>Recibos do evento</h3><div class="sub">Consulta e imprime cada recibo, mesmo depois do fecho.</div><div class="actions"><button class="btn outline" onclick="openEventReceipt(${e.id},'detail')">Recibo do evento</button><button class="btn outline" onclick="openEventReceipt(${e.id},'publisher')">Recibo para a editora</button></div></section>`}
function openEventReceipt(id,type){const snapshot=getEventReceiptSnapshot(id);if(!snapshot)return;rememberStation();receiptPreview=snapshot;modal(type==='publisher'?'Recibo para a editora':'Recibo do evento','',`<button type="button" class="btn dark receipt-print-button" onclick="printReceiptPreview('${type}')">${icon('file')}Imprimir recibo</button>${renderEventReceipt(snapshot,type)}`,'',null)}
function printReceiptPreview(type){if(!receiptPreview)return;let target=document.getElementById('receiptPrint');if(!target){target=document.createElement('div');target.id='receiptPrint';document.body.appendChild(target)}target.innerHTML=renderEventReceipt(receiptPreview,type);document.body.classList.add('receipt-printing');try{window.print()}catch{document.body.classList.remove('receipt-printing');toast('Não foi possível abrir a impressão.')}}
window.addEventListener('afterprint',()=>document.body.classList.remove('receipt-printing'));
function closeReceiptPreviews(snapshot){return `<div class="close-receipts">${[['detail','Recibo do evento'],['publisher','Recibo para a editora']].map(([type,label])=>`<details class="receipt-preview"><summary>${label}</summary><button type="button" class="btn outline" onclick="printReceiptPreview('${type}')">Imprimir pré-visualização</button>${renderEventReceipt(snapshot,type)}</details>`).join('')}</div>`}

function openCloseEvent(id){
  const e=eventById(id);if(!e||e.status!=='open')return toast('O evento não está aberto.');const t=eventTotals(id),f=eventMoney(e),back=e.booksTaken-t.used,own=f.own,expected=f.cashBalance;
  if(!cashIsValid(e))return toast('A caixa tem valores inconsistentes. Confere os trocos, donativos e retiradas antes de fechar.');
  const body=`${eventMoneyCards(e)}<div class="note">${euro(f.own)} de trocos e ${euro(f.donationsInCash)} de donativos ainda estão na caixa. Para os retirar, cancela e usa o separador Caixa.</div><div class="closegrid">${input('books','Livros que voltam',back,'number','min="0" required')}${input('cashSales','Numerário recebido no evento (€)',(t.cash/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}${input('mbway','MB WAY recebido no evento (€)',(t.mbway/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}${input('cashPhysical','Dinheiro que contas agora na caixa (€)',(expected/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}</div><div class="hint">Numerário e MB WAY recebidos incluem donativos. A caixa já desconta retiradas e envios em numerário.</div>${area('note','Observações do fecho','','Obrigatório se existir alguma diferença')}`;
  modal('Conferir o evento','Confere os valores. A seguir podes ver os dois recibos antes de fechar.',body,'Rever resumo final',fd=>{const vals={books:Number(fd.get('books')),cashSales:parseMoney(fd.get('cashSales')),mbway:parseMoney(fd.get('mbway')),cashPhysical:parseMoney(fd.get('cashPhysical')),note:String(fd.get('note')||'').trim()};if(!String(fd.get('books')??'').trim()||!Number.isInteger(vals.books)||vals.books<0||['cashSales','mbway','cashPhysical'].some(k=>!String(fd.get(k)??'').trim()||vals[k]<0))return toast('Preenche as contagens e os valores do fecho.');if(vals.books!==back)return toast(`A contagem tem de coincidir com ${back} livros.`);const diff=vals.cashSales!==t.cash||vals.mbway!==t.mbway||vals.cashPhysical!==expected;if(diff&&!vals.note)return toast('Explica a diferença nas observações.');openCloseReview(e,t,back,own,expected,vals)});
}
function openCloseReview(e,t,back,own,expected,v){
  receiptPreview=makeEventReceiptSnapshot(e,v);
  modal('Confirmar o fecho','Confere os dois recibos. Ficam guardados no Resumo do evento.',`<div class="review"><div><small>Livros contados</small><b>${v.books}</b></div><div><small>Dinheiro contado na caixa</small><b>${euro(v.cashPhysical)}</b></div><div><small>Diferença na caixa</small><b>${euro(v.cashPhysical-expected)}</b></div></div>${v.note?`<div class="warning">${esc(v.note)}</div>`:''}${closeReceiptPreviews(receiptPreview)}`,'Confirmar e fechar',()=>{
    if(e.status!=='open')return;const snapshot=makeEventReceiptSnapshot(e,v);e.status='closed';e.closingBooks=v.books;e.closingSalesCashCents=v.cashSales;e.closingMbwayCents=v.mbway;e.closingCashCents=v.cashPhysical;e.closingNote=v.note;e.closedAt=now();e.updatedAt=now();e.closingSnapshot={...t,ownCash:own,expectedCash:expected,booksBack:back,closingSalesCashCents:v.cashSales,closingMbwayCents:v.mbway};snapshot.event.status='closed';snapshot.event.closedAt=e.closedAt;snapshot.reconstructed=false;e.receiptSnapshot=snapshot;closeModal();eventTab='summary';toast('Evento fechado. Os dois recibos estão disponíveis.');persist();
  });
}
function openSettings(){const settings=state.settings;modal('Definições gerais','Stock e preço para novas vendas. As percentagens são definidas em cada evento ou venda avulsa.',input('stock','Stock inicial',settings.initialStock,'number','min="0"')+input('price','Preço habitual por livro (€)',(settings.defaultPriceCents/100).toFixed(2).replace('.',','))+`<div class="note">Todo o valor dos livros é enviado à editora. Consulta as nossas percentagens em Dinheiro → Percentagens.</div>`,'Guardar',fd=>{const stock=Number(fd.get('stock')),price=parseMoney(fd.get('price'));if(!Number.isInteger(stock)||stock<totals().used||price<0)return toast('Confere o stock e o preço.');settings.initialStock=stock;settings.defaultPriceCents=price;closeModal();toast('Definições guardadas');persist()})}
function exportBackup(){const payload={...state,version:DATA_VERSION,exportedAt:now()};downloadText(`o-bando-da-barriga-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('Cópia de segurança exportada')}
function isValidBackup(x){return x&&typeof x==='object'&&x.settings&&Array.isArray(x.events)&&Array.isArray(x.records)&&Array.isArray(x.cashMovements)&&Array.isArray(x.publisherPayments)}
function importBackup(inputEl){const file=inputEl.files&&inputEl.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||''));if(!isValidBackup(data))throw new Error('invalid');confirmModal('Importar esta cópia?','Os dados atuais online serão substituídos pelos dados do ficheiro.','Sim, importar',()=>{state={...seed(),...data,version:DATA_VERSION};closeModal();view='home';currentEventId=null;persist();toast('Dados importados')})}catch{toast('O ficheiro não é uma cópia válida.')}finally{inputEl.value=''}};reader.readAsText(file)}
function confirmClearAll(){confirmModal('Apagar todos os dados?','Eventos, vendas, ofertas, movimentos e pagamentos serão eliminados da base de dados online. Exporta uma cópia primeiro se precisares de os guardar.','Sim, apagar tudo',()=>{state=seed();closeModal();view='home';currentEventId=null;persist();toast('Dados apagados')})}
function downloadText(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)} async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copiado')}catch{toast('Não foi possível copiar')}}
function confirmModal(title,desc,label,onConfirm){modal(title,desc,'',label,()=>{closeModal();onConfirm()},true)}
window.addEventListener('beforeunload',e=>{if(stateRevision>savedRevision){e.preventDefault();e.returnValue=''}});
function blockPageZoom(){let lastTouchEnd=0;document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<=300&&!e.target.closest('button,a,input,select,textarea,summary'))e.preventDefault();lastTouchEnd=n},{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key))e.preventDefault()})}
blockPageZoom();
let modalTouchY=null;
const modalOverlay=document.getElementById('modal');
modalOverlay.addEventListener('touchstart',e=>{modalTouchY=e.touches.length===1?e.touches[0].clientY:null},{passive:true});
modalOverlay.addEventListener('touchmove',e=>{
  if(e.touches.length!==1||modalTouchY===null)return;
  const y=e.touches[0].clientY,delta=y-modalTouchY;modalTouchY=y;
  if(!delta)return;
  // Allow the nearest scrollable field/body to consume the current direction.
  const body=document.getElementById('modalBody');let el=e.target instanceof Element?e.target:null;
  if(el&&body.contains(el)){
    while(el){
      const overflow=getComputedStyle(el).overflowY;
      if(/auto|scroll/.test(overflow)&&el.scrollHeight>el.clientHeight+1){
        if((delta<0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)||(delta>0&&el.scrollTop>0))return;
      }
      if(el===body)break;el=el.parentElement;
    }
  }
  if(e.cancelable)e.preventDefault();
},{passive:false});
modalOverlay.addEventListener('touchend',()=>{modalTouchY=null},{passive:true});
modalOverlay.addEventListener('touchcancel',()=>{modalTouchY=null},{passive:true});
loadRemote();
</script></body></html>
